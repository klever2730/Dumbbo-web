<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Menú - Dumbbo Café</title>
	<link href="css/templatemo-style.css" rel="stylesheet" />
	<style>
    /* ===== COLORES DUMBBO ===== */
    :root {
        --rosa-dumbbo: #F0AEC9;
        --rosa-claro: #FCE8F1;
        --rosa-oscuro: #7A294D;
        --texto: #3A2630;
        --blanco: #FFFFFF;
        --precio-rojo: #E53935;
        --gris-suave: #F8F9FA;
    }

    /* ===== FONDO GENERAL ===== */
    body {
        background-color: var(--rosa-claro);
        color: var(--texto);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-image: url('img/logo.png?v=2');
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: 85vw auto;
    }

    /* ===== BANNER PRINCIPAL ===== */
    .banner-header {
        width: 100%;
        margin-bottom: 25px;
        overflow: hidden;
        background-color: var(--rosa-dumbbo);
        box-shadow: 0 4px 15px rgba(122, 41, 77, 0.12);
    }

    .banner-img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }

    /* ===== CONTENEDOR PRINCIPAL DEL MENÚ ===== */
    .menu-container {
        max-width: 950px;
        margin: 0 auto 40px auto;
        padding: 25px 20px;
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(122, 41, 77, 0.10);
        box-sizing: border-box;
    }

    /* ===== CABECERA Y TÍTULO ===== */
    .menu-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--rosa-claro);
    }

    .menu-titulo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--rosa-oscuro);
        margin: 0;
        letter-spacing: -0.5px;
    }

    /* BOTÓN Y BARRA DE CATEGORÍAS */
    .categoria-bar-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .btn-categorias-menu {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        border-radius: 25px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.2);
    }

    #cliente-categoria-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) transparent;
    }

    #cliente-categoria-nav::-webkit-scrollbar {
        height: 4px;
    }

    #cliente-categoria-nav::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 4px;
    }

    .filtro-cliente-btn {
        background-color: var(--rosa-claro);
        color: var(--rosa-oscuro);
        border: 1px solid var(--rosa-dumbbo);
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .filtro-cliente-btn:hover,
    .filtro-cliente-btn.active {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
    }

    /* ===== SECCIONES Y CARRUSEL HORIZONTAL ===== */
    .categoria-seccion {
        margin-bottom: 35px;
    }

    .categoria-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .categoria-titulo {
        color: var(--rosa-oscuro);
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0;
    }

    .ver-mas-link {
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
        font-weight: 500;
    }

    /* CONTENEDOR HORIZONTAL SCROLLABLE */
    .productos-horizontal-scroll {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 5px 2px 15px 2px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .productos-horizontal-scroll::-webkit-scrollbar {
        display: none;
    }

    /* TARJETA DE PRODUCTO VERTICAL (ESTILO CATÁLOGO) */
    .producto-card-vertical {
        min-width: 165px;
        width: 165px;
        flex-shrink: 0;
        background-color: var(--blanco);
        border: 1px solid #F1D3DF;
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.04);
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        position: relative;
    }

    .producto-card-vertical:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(122, 41, 77, 0.12);
    }

    .producto-img-container {
        width: 100%;
        height: 120px;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 10px;
        background-color: var(--rosa-claro);
    }

    .producto-imagen-v {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .badge-promocion-v {
        position: absolute;
        top: 18px;
        left: 18px;
        background-color: var(--precio-rojo);
        color: var(--blanco);
        font-size: 0.65rem;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .producto-nombre-v {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--texto);
        margin-bottom: 4px;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.4em;
    }

    .producto-descripcion-v {
        font-size: 0.75rem;
        color: #777;
        margin-bottom: 10px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .producto-footer-v {
        margin-top: auto;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .producto-precio-v {
        font-size: 1rem;
        font-weight: 800;
        color: var(--precio-rojo);
    }

    .btn-agregar-v {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
    }

    /* DUMBBITO FLOTANTE */
    .dumbbito-flotante {
        position: fixed;
        top: 50%;
        left: calc(50% - 475px - 180px);
        transform: translateY(-50%);
        width: 160px;
        height: auto;
        z-index: 999;
        pointer-events: none;
        transition: all 0.3s ease;
    }

    /* MEDIA QUERIES */
    @media (max-width: 1300px) {
        .dumbbito-flotante {
            left: 15px;
            width: 120px;
        }
    }

    @media (max-width: 992px) {
        .banner-header {
            margin-bottom: 20px;
        }

        .menu-container {
            margin: 0 10px 30px 10px;
            padding: 18px 12px;
        }

        .dumbbito-flotante {
            display: none;
        }

        .producto-card-vertical {
            min-width: 145px;
            width: 145px;
            padding: 10px;
        }

        .producto-img-container {
            height: 105px;
        }
    }
    </style>
</head>
<body>

	<!-- Banner Superior -->
	<div class="banner-header">
		<img src="img/banner.jpg" alt="Dumbbo Café Banner" class="banner-img">
	</div>

	<!-- Recuadro del Menú -->
	<div class="menu-container">
		<div class="menu-header-bar">
			<h1 class="menu-titulo">Menú</h1>
		</div>

		<div class="categoria-bar-wrapper">
			<button class="btn-categorias-menu">
				<span>≡</span> Categorías
			</button>
			<div id="cliente-categoria-nav"></div>
		</div>

		<div id="menu-contenedor"></div>
	</div>

	<!-- Dumbbito Flotante -->
	<img src="img/dumbbito.png" alt="Dumbbito" class="dumbbito-flotante">

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
		import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

		const firebaseConfig = {
		  apiKey: "AIzaSyDEhG5JEj8s2GMQgdceHY3LeUa_32jx_MI",
		  authDomain: "dumbbo-menu.firebaseapp.com",
		  projectId: "dumbbo-menu",
		  storageBucket: "dumbbo-menu.firebasestorage.app",
		  messagingSenderId: "875230670130",
		  appId: "1:875230670130:web:63ad4fb93cb7bf2c8bbb2b"
		};

		const app = initializeApp(firebaseConfig);
		const db = getFirestore(app);

		let todosLosProductos = [];

		onSnapshot(collection(db, "productos"), (snapshot) => {
		  todosLosProductos = [];
		  snapshot.forEach((docSnap) => {
		    const data = docSnap.data();
		    if (data.disponible) {
		      todosLosProductos.push({ id: docSnap.id, ...data });
		    }
		  });
		  crearFiltrosCliente(todosLosProductos);
		  renderizarMenuCliente(todosLosProductos, "todos");
		});

		function renderizarMenuCliente(productos, filtroSeleccionado) {
		  const contenedor = document.getElementById("menu-contenedor");

		  if (productos.length === 0) {
		    contenedor.innerHTML = "<p style='text-align:center;'>No hay productos disponibles por el momento.</p>";
		    return;
		  }

		  let html = "";

		  if (filtroSeleccionado === "todos") {
		    const productosPromocion = productos.filter(p => p.promocion);
		    if (productosPromocion.length > 0) {
		      html += `
		        <div class="categoria-seccion" id="cat-promociones">
		          <div class="categoria-header-row">
		            <h2 class="categoria-titulo">🔥 Promos y novedades</h2>
		            <span class="ver-mas-link">Ver más ›</span>
		          </div>
		          <div class="productos-horizontal-scroll">
		      `;
		      productosPromocion.forEach(p => {
		        html += crearTarjetaVertical(p);
		      });
		      html += `
		          </div>
		        </div>
		      `;
		    }
		  }

		  const categorias = [...new Set(productos.map(p => p.categoria))];

		  categorias.forEach(cat => {
		    const productosCat = productos.filter(p => p.categoria === cat);

		    if (productosCat.length > 0) {
		      html += `
		        <div class="categoria-seccion" id="cat-${cat.replace(/\s+/g, '-')}">
		          <div class="categoria-header-row">
		            <h2 class="categoria-titulo">${cat}</h2>
		            <span class="ver-mas-link">Ver más ›</span>
		          </div>
		          <div class="productos-horizontal-scroll">
		      `;

		      productosCat.forEach(p => {
		        html += crearTarjetaVertical(p);
		      });

		      html += `
		          </div>
		        </div>
		      `;
		    }
		  });

		  contenedor.innerHTML = html;
		}

		function crearTarjetaVertical(p) {
		  return `
		    <div class="producto-card-vertical">
		      ${p.promocion ? '<span class="badge-promocion-v">Oferta</span>' : ''}
		      <div class="producto-img-container">
		        <img src="${p.imagenUrl || 'img/logo.png'}" alt="${p.nombre}" class="producto-imagen-v">
		      </div>
		      <div class="producto-nombre-v">${p.nombre}</div>
		      <div class="producto-descripcion-v">${p.descripcion || ''}</div>
		      <div class="producto-footer-v">
		        <div class="producto-precio-v">$${Number(p.precio).toLocaleString('es-CL')}</div>
		      </div>
		    </div>
		  `;
		}

		function crearFiltrosCliente(productos) {
		  const categorias = [...new Set(productos.map(p => p.categoria))];
		  const nav = document.getElementById("cliente-categoria-nav");

		  let html = `<button class="filtro-cliente-btn active" data-cat="todos">Todos</button>`;
		  categorias.forEach(cat => {
		    html += `<button class="filtro-cliente-btn" data-cat="${cat}">${cat}</button>`;
		  });
		  nav.innerHTML = html;

		  document.querySelectorAll(".filtro-cliente-btn").forEach(btn => {
		    btn.addEventListener("click", () => {
		      document.querySelectorAll(".filtro-cliente-btn").forEach(b => b.classList.remove("active"));
		      btn.classList.add("active");

		      const categoriaSel = btn.dataset.cat;
		      if (categoriaSel === "todos") {
		        renderizarMenuCliente(todosLosProductos, "todos");
		      } else {
		        const filtrados = todosLosProductos.filter(p => p.categoria === categoriaSel);
		        renderizarMenuCliente(filtrados, categoriaSel);
		      }
		    });
		  });
		}
	</script>
</body>
</html>
