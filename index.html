<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Menú - Dumbbo Café</title>
	<link href="css/templatemo-style.css" rel="stylesheet" />
	<style>
    /* ===== COLORES DUMBBO ===== */
    :root {
        --rosa-dumbbo: #F0AEC9;
        --rosa-claro: #FCE8F1;
        --rosa-oscuro: #7A294D;
        --texto: #3A2630;
        --blanco: #FFFFFF;
        --precio-rojo: #E53935;
        --gris-suave: #F8F9FA;
    }

    /* ===== FONDO GENERAL ===== */
    body {
        background-color: var(--rosa-claro);
        color: var(--texto);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-image: url('img/logo.png?v=2');
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: 85vw auto;
    }

    /* ===== BANNER PRINCIPAL ===== */
    .banner-header {
        width: 100%;
        margin-bottom: 25px;
        overflow: hidden;
        background-color: var(--rosa-dumbbo);
        box-shadow: 0 4px 15px rgba(122, 41, 77, 0.12);
    }

    .banner-img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }

    /* ===== CONTENEDOR PRINCIPAL DEL MENÚ ===== */
    .menu-container {
        max-width: 950px;
        margin: 0 auto 40px auto;
        padding: 25px 20px;
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(122, 41, 77, 0.10);
        box-sizing: border-box;
    }

    /* ===== CABECERA Y TÍTULO CENTRADO ===== */
    .menu-header-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--rosa-claro);
    }

    .menu-titulo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--rosa-oscuro);
        margin: 0;
        letter-spacing: -0.5px;
        text-align: center;
    }

    /* BOTÓN Y BARRA DE CATEGORÍAS */
    .categoria-bar-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    .btn-categorias-menu {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        border-radius: 25px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.2);
    }

    #cliente-categoria-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        border-bottom: 1px solid #F1D3DF;
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) transparent;
        width: 100%;
        white-space: nowrap;
    }

    #cliente-categoria-nav::-webkit-scrollbar {
        height: 4px;
    }

    #cliente-categoria-nav::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 4px;
    }

    .filtro-cliente-btn {
        background-color: var(--rosa-claro);
        color: var(--rosa-oscuro);
        border: 1px solid var(--rosa-dumbbo);
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .filtro-cliente-btn:hover,
    .filtro-cliente-btn.active {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
    }

    /* ===== SECCIONES Y CARRUSEL HORIZONTAL ESTILO CASTAÑO ===== */
    .categoria-seccion {
        margin-bottom: 35px;
    }

    .categoria-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .categoria-titulo {
        color: var(--rosa-oscuro);
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0;
    }

    .ver-mas-link {
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
        font-weight: 500;
    }

    /* CONTENEDOR HORIZONTAL SCROLLABLE */
    .productos-horizontal-scroll {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 5px 2px 15px 2px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }

    .productos-horizontal-scroll::-webkit-scrollbar {
        height: 5px;
    }

    .
