<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Menú - Dumbbo Café</title>

	<meta name="description" content="Café, dulces y algo más para cada antojo 🐘☕. Descubre el menú completo y las promociones de Dumbbo Café." />
	
	<!-- Icono para la pestaña del navegador, favoritos y dispositivos Apple -->
	<link rel="icon" type="image/png" href="img/logo-rosa2.png" />
	<link rel="apple-touch-icon" href="img/logo-rosa2.png" />

	<!-- Open Graph (WhatsApp, Facebook, Instagram) -->
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Dumbbo Café - Menú" />
	<meta property="og:description" content="Café, dulces y algo más para cada antojo 🐘☕. Descubre el menú completo y las promociones." />
	<meta property="og:image" content="https://klever2730.github.io/Dumbbo-web/img/logo-rosa2.png" />
	<meta property="og:url" content="https://klever2730.github.io/Dumbbo-web/" />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="Dumbbo Café - Menú" />
	<meta name="twitter:description" content="Café, dulces y algo más para cada antojo 🐘☕" />
	<meta name="twitter:image" content="https://klever2730.github.io/Dumbbo-web/img/logo-rosa2.png" />
	
	<link href="css/templatemo-style.css" rel="stylesheet" />
	<style>

    /* ===== COLORES DUMBBO ===== */
    :root {
        --rosa-dumbbo: #F0AEC9;
        --rosa-claro: #FCE8F1;
        --rosa-oscuro: #7A294D;
        --texto: #3A2630;
        --blanco: #FFFFFF;
        --precio-rojo: #E53935;
        --gris-suave: #F8F9FA;
    }

    /* ===== BLOQUEA EL ZOOM (pellizco y doble-tap) EN TODA LA PÁGINA ===== */
    html {
        touch-action: manipulation;
    }

    /* =====================================================
       SELECTOR DE LOCAL
       ===================================================== */

    .selector-local-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: var(--rosa-claro);
        background-image: url('img/fondo.png');
        background-repeat: repeat-y;
        background-position: center top;
        background-size: 100% auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 100000;
    }

    .selector-local-overlay.oculto {
        display: none;
    }

    .selector-local-contenedor {
        width: 100%;
        max-width: 430px;
        background-color: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border-radius: 24px;
        padding: 32px 24px;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 12px 40px rgba(122, 41, 77, 0.18);
    }

    .selector-local-titulo {
        margin: 0 0 8px 0;
        color: var(--rosa-oscuro);
        font-size: 2rem;
        font-weight: 800;
    }

    .selector-local-subtitulo {
        margin: 0 0 28px 0;
        color: #8A6B78;
        font-size: 0.98rem;
        font-weight: 500;
    }

    .selector-local-lista {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .selector-local-btn {
        width: 100%;
        min-height: 58px;
        border: 2px solid var(--rosa-dumbbo);
        border-radius: 16px;
        background-color: var(--blanco);
        color: var(--rosa-oscuro);
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.06);
        touch-action: manipulation;
    }

    .selector-local-btn:hover {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
        box-shadow: 0 6px 15px rgba(122, 41, 77, 0.16);
    }

    .selector-local-btn:active {
        transform: scale(0.97);
    }


/* ===== FONDO GENERAL ===== */
    body {
        background-color: var(--rosa-claro);
        color: var(--texto);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Bloquea la selección de texto para que se sienta como una App nativa */
        -webkit-user-select: none; /* Safari y Chrome */
        -moz-user-select: none;    /* Firefox */
        -ms-user-select: none;     /* Edge y navegadores antiguos */
        user-select: none;         /* Estándar moderno */

        /* Fondo Dumbbo */
        background-image: url('img/fondo.png');
        background-repeat: repeat-y;
        background-position: center top;

        /* Fondo adaptable */
        background-size: 100% auto;

        /* El fondo se mueve junto con la página */
        background-attachment: scroll;
    }


    /* ===== BANNER PRINCIPAL ===== */
    .banner-header {
        width: 100%;
        margin-bottom: 25px;
        overflow: hidden;
        background-color: var(--rosa-dumbbo);
        box-shadow: 0 4px 15px rgba(122, 41, 77, 0.12);
    }

    .banner-img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }


    /* ===== CONTENEDOR PRINCIPAL DEL MENÚ ===== */
    .menu-container {
        max-width: 950px;
        margin: 0 auto 40px auto;
        padding: 25px 20px;
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(122, 41, 77, 0.10);
        box-sizing: border-box;
    }


    /* ===== CABECERA Y TÍTULO ===== */
    .menu-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--rosa-claro);
    }

    .menu-titulo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--rosa-oscuro);
        margin: 0;
        letter-spacing: -0.5px;
    }

    .menu-subtitulo {
        font-size: 0.95rem;
        color: #8A6B78;
        margin: 6px 0 0 0;
        font-weight: 500;
    }


    /* ===== DUMBBITO AL LADO DEL TÍTULO ===== */

    .dumbbito-wrapper {
        position: relative;
        width: 100px;
        flex-shrink: 0;
    }

    .dumbbito-flotante {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
        transition: transform 0.15s ease;
    }

    .dumbbito-flotante:active {
        transform: scale(0.95);
    }


    /* ===== BURBUJA DE DIÁLOGO ===== */
    .dumbbito-burbuja {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(10px) scale(0.8);
        margin-bottom: 12px;
        min-width: 180px;
        max-width: 220px;
        background-color: var(--blanco);
        color: var(--rosa-oscuro);
        border: 2px solid var(--rosa-dumbbo);
        border-radius: 16px;
        padding: 12px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 6px 18px rgba(122, 41, 77, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .dumbbito-burbuja.mostrar {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
    }

    .dumbbito-burbuja::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: var(--rosa-dumbbo);
    }
		
			
	/* ===== BOTÓN Y BARRA DE CATEGORÍAS ===== */
    .categoria-bar-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .btn-categorias-menu {
        background-color: var(--rosa-claro); /* Empieza claro (apagado) */
        color: var(--rosa-oscuro);
        border: 1px solid var(--rosa-dumbbo);
        border-radius: 25px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.08);
        transition: all 0.2s ease;
    }

    /* Cuando el botón está activo (desplegado) */
    .btn-categorias-menu.activo {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.2);
    }

    #cliente-categoria-nav {
        display: none; /* OCULTO POR DEFECTO */
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) transparent;
        animation: deslizar 0.25s ease-out; /* Animación para que aparezca suave */
    }

    /* Se muestra cuando se le agrega esta clase por JavaScript */
    #cliente-categoria-nav.mostrar {
        display: flex;
    }

    @keyframes deslizar {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    #cliente-categoria-nav::-webkit-scrollbar {
        height: 4px;
    }

    #cliente-categoria-nav::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 4px;
    }

    .filtro-cliente-btn {
        background-color: var(--rosa-claro);
        color: var(--rosa-oscuro);
        border: 1px solid var(--rosa-dumbbo);
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .filtro-cliente-btn:hover,
    .filtro-cliente-btn.active {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
    }


    /* ===== SECCIONES Y CARRUSEL HORIZONTAL ===== */
    .categoria-seccion {
        margin-bottom: 35px;
    }

    .categoria-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .categoria-titulo {
        color: var(--rosa-oscuro);
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0;
    }
		
	.ver-mas-link {
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer; /* <-- Recuperamos la manito */
    }


    /* ===== PANTALLA DE CARGA INICIAL DEL MENÚ ===== */
    .menu-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 70px 20px;
        color: var(--rosa-oscuro);
        gap: 16px;
    }

    .menu-loader-spinner {
        width: 42px;
        height: 42px;
        border: 4px solid var(--rosa-claro);
        border-top-color: var(--rosa-oscuro);
        border-radius: 50%;
        animation: menu-loader-girar 0.8s linear infinite;
    }

    @keyframes menu-loader-girar {
        to {
            transform: rotate(360deg);
        }
    }

    .menu-loader-texto {
        font-size: 0.95rem;
        font-weight: 700;
	}
		
	
	/* ===== CONTENEDOR HORIZONTAL SCROLLABLE (TODOS LOS DISPOSITIVOS) ===== */
    .productos-horizontal-scroll {
        display: grid;
        /* Toma el cálculo matemático del JS y usa casillas de 165px en PC */
        grid-template-columns: repeat(var(--columnas-movil, 12), 165px);
        grid-auto-flow: row; /* Obliga a formar las 3 filas en lugar de 1 infinita */
        gap: 15px;
        
        /* El scroll es hacia la DERECHA */
        overflow-x: auto;
        overflow-y: hidden;
        padding: 5px 2px 15px 2px;
        
        /* Se quita el scroll-behavior: smooth para que la rueda del ratón no tenga "lag" */
        -webkit-overflow-scrolling: touch;
        
        /* Diseño de la barra horizontal en PC */
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) var(--rosa-claro);
    }

    .productos-horizontal-scroll::-webkit-scrollbar {
        height: 8px; /* Usamos height porque la barra ahora está abajo (horizontal) */
    }
    .productos-horizontal-scroll::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 10px;
    }
    .productos-horizontal-scroll::-webkit-scrollbar-track {
        background-color: var(--rosa-claro);
        border-radius: 10px;
    }
		
	/* ===== CONTENEDOR VISTA FILTRADA (SCROLL VERTICAL INTERNO) ===== */
    .productos-grid-vertical {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
        gap: 15px;
        padding: 5px 5px 15px 2px;
        justify-items: center; 
        
        /* Limita la altura de la caja a un 65% de la pantalla y activa el scroll interno */
        max-height: 65vh; 
        overflow-y: auto;
        overflow-x: hidden;
        align-content: start;
        
        /* Diseño de la barra */
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) var(--rosa-claro);
    }

    .productos-grid-vertical::-webkit-scrollbar {
        width: 8px;
    }
    .productos-grid-vertical::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 10px;
    }
    .productos-grid-vertical::-webkit-scrollbar-track {
        background-color: var(--rosa-claro);
        border-radius: 10px;
    }

		
	/* ===== TARJETA DE PRODUCTO ===== */
    .producto-card-vertical {
        width: 100%;       /* Se adapta al ancho de la columna */
        max-width: 180px;  /* Evita que se haga gigante */
        margin: 0 auto;    /* La centra */
        flex-shrink: 0;
        background-color: var(--blanco);
        border: 1px solid #F1D3DF;
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.04);
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        position: relative;

        /* NUEVO: indica que la tarjeta se puede tocar */
        cursor: pointer;
    }

    .producto-card-vertical:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(122, 41, 77, 0.12);
    }	
		
		
	/* ===== ESTILOS PARA PRODUCTOS AGOTADOS ===== */
    .producto-card-vertical.agotado {
        opacity: 0.65; /* Hace que toda la tarjeta se vea un poco transparente */
    }

    .badge-agotado-v {
        position: absolute;
        top: 18px;
        left: 18px;
        background-color: #607D8B; /* Gris azulado */
        color: var(--blanco);
        font-size: 0.65rem;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        z-index: 2; /* Para que quede por encima de la foto */
    }

    .producto-precio-v.precio-tachado {
        color: #9E9E9E; /* Color gris para el precio */
        text-decoration: line-through; /* Tacha el número */
        font-weight: 600;
    }

    .producto-nombre-v {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--texto);
        margin-bottom: 4px;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.4em;
    }

    .producto-descripcion-v {
        font-size: 0.75rem;
        color: #777;
        margin-bottom: 10px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .producto-footer-v {
        margin-top: auto;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .producto-precio-v {
        font-size: 1rem;
        font-weight: 800;
        color: var(--precio-rojo);
    }

    .btn-agregar-v {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
    }


    /* =====================================================
       POPUP DE PRODUCTO
       ===================================================== */

    .producto-popup-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 99999;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .producto-popup-overlay.mostrar {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .producto-popup {
        position: relative;
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--blanco);
        border-radius: 22px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        padding: 18px;
        box-sizing: border-box;
        touch-action: manipulation;

        transform: translateY(20px) scale(0.96);
        transition: transform 0.25s ease;
    }

    .producto-popup-overlay.mostrar .producto-popup {
        transform: translateY(0) scale(1);
    }

    .producto-popup-cerrar {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: var(--rosa-oscuro);
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    .producto-popup-cerrar:active {
        transform: scale(0.92);
    }

    .producto-popup-imagen-container {
        position: relative;
        width: 100%;
        height: 300px;
        border-radius: 17px;
        overflow: hidden;
        background-color: var(--blanco);
        margin-bottom: 12px;
        touch-action: manipulation;
    }

    .producto-popup-imagen {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .producto-popup-imagen.cargada {
        opacity: 1;
    }

    .popup-imagen-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 32px;
        border: 4px solid var(--rosa-claro);
        border-top-color: var(--rosa-oscuro);
        border-radius: 50%;
        animation: menu-loader-girar 0.8s linear infinite;
        z-index: 1;
    }

    .popup-imagen-spinner.oculto {
        display: none;
    }

    /* ===== FLECHAS DEL CARRUSEL DEL POPUP ===== */
    .popup-carrusel-flecha {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.88);
        border: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 1.3rem;
        font-weight: bold;
        color: var(--rosa-oscuro);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
        z-index: 2;
        touch-action: manipulation;
    }

    .popup-carrusel-flecha:active {
        transform: translateY(-50%) scale(0.92);
    }

    .popup-carrusel-flecha.izq {
        left: 10px;
    }

    .popup-carrusel-flecha.der {
        right: 10px;
    }

    /* ===== PUNTOS INDICADORES DEL CARRUSEL DEL POPUP ===== */
    .popup-carrusel-puntos {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 16px;
    }

    .popup-carrusel-punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #E3C4D3;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
        touch-action: manipulation;
    }

    .popup-carrusel-punto.activo {
        background-color: var(--rosa-oscuro);
        transform: scale(1.25);
    }

    .producto-popup-badge {
        display: inline-block;
        background-color: var(--precio-rojo);
        color: var(--blanco);
        font-size: 0.78rem;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .producto-popup-nombre {
        margin: 0 45px 10px 0;
        color: var(--rosa-oscuro);
        font-size: 1.65rem;
        line-height: 1.2;
        font-weight: 800;
    }

    .producto-popup-descripcion {
        margin: 0 0 18px 0;
        color: #666;
        font-size: 1rem;
        line-height: 1.6;
        white-space: pre-line;
    }

    .producto-popup-precio {
        color: var(--precio-rojo);
        font-size: 1.45rem;
        font-weight: 900;
        margin: 0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 992px) {

        .banner-header {
            margin-bottom: 20px;
        }

        .menu-container {
            margin: 0 10px 30px 10px;
            padding: 18px 12px;
        }


        /* =================================================
           DUMBBITO JUNTO A "MENÚ" EN DISPOSITIVOS MÓVILES
           ================================================= */

        .dumbbito-wrapper {
            position: relative;
            width: 65px;
            right: auto;
            left: auto;
            top: auto;
            transform: none;
        }

		/* RECUPERAMOS EL CONTENEDOR EN MÓVIL (SCROLL HORIZONTAL MATEMÁTICO) */
        .productos-horizontal-scroll {

        /* ===== PRODUCTOS EN MÓVIL ===== */

	<!-- =====================================================
	     FIREBASE + JAVASCRIPT
	     ===================================================== -->

	<script type="module">

		import {
			initializeApp
		}
		from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";


		import {
			getFirestore,
			collection,
			onSnapshot
		}
		from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";



		const firebaseConfig = {

			apiKey: "AIzaSyDEhG5JEj8s2GMQgdceHY3LeUa_32jx_MI",

			authDomain: "dumbbo-menu.firebaseapp.com",

			projectId: "dumbbo-menu",

			storageBucket: "dumbbo-menu.firebasestorage.app",

			messagingSenderId: "875230670130",

			appId: "1:875230670130:web:63ad4fb93cb7bf2c8bbb2b"

		};



		const app = initializeApp(firebaseConfig);

		const db = getFirestore(app);
		
		// PRECARGA EN CACHÉ
		
		let todosLosProductos = [];
		// Guarda qué categoría tiene seleccionada el cliente ("todos" por defecto), para que
		// una actualización en tiempo real (onSnapshot) no le resetee el filtro que ya eligió.
		let filtroActualCliente = "todos";

		/* ===== CACHÉ DE IMÁGENES EN MEMORIA ===== */
		// Guarda un registro de las fotos ya precargadas para no gastar internet de más
		const cacheDeImagenes = new Set();

		function precargarFotosEnSegundoPlano(productos) {
			// El navegador descargará estas fotos invisiblemente y las dejará en RAM
			productos.forEach(p => {
				
				// 1. Precargar foto principal de la tarjeta
				if (p.imagenUrl && !cacheDeImagenes.has(p.imagenUrl)) {
					const imgPrincipal = new Image();
					imgPrincipal.src = p.imagenUrl;
					cacheDeImagenes.add(p.imagenUrl);
				}
				
				// 2. Precargar fotos extra (las que se ven dentro del popup)
				if (Array.isArray(p.imagenesExtra)) {
					p.imagenesExtra.forEach(url => {
						if (url && !cacheDeImagenes.has(url)) {
							const imgExt = new Image();
							imgExt.src = url;
							cacheDeImagenes.add(url);
						}
					});
				}
			});
		}


		/* ===== ESCAPA TEXTO PARA EVITAR HTML NO DESEADO ===== */

		function escaparHtml(texto) {

			return String(texto ?? "")
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#039;");

		}


		/* =====================================================
		   SELECTOR DE LOCAL
		   ===================================================== */

		const LOCALES_PERMITIDOS = [
			"GHU",
			"VK1",
			"Duoc"
		];


		const parametrosURL =
			new URLSearchParams(
				window.location.search
			);


		const localParametro =
			parametrosURL.get("local");


		const LOCAL_ACTUAL =
			LOCALES_PERMITIDOS.includes(
				localParametro
			)
			? localParametro
			: null;


		const selectorLocalOverlay =
			document.getElementById(
				"selector-local-overlay"
			);


		/* Si existe un local válido en la URL,
		   se oculta el selector y se carga
		   directamente ese local. */

		if (LOCAL_ACTUAL) {

			selectorLocalOverlay.classList.add(
				"oculto"
			);

		}


		/* Botones del selector */

		document
			.querySelectorAll(
				".selector-local-btn"
			)
			.forEach(btn => {

				btn.addEventListener(
					"click",
					() => {


						const localSeleccionado =
							btn.dataset.local;


						if (
							!LOCALES_PERMITIDOS.includes(
								localSeleccionado
							)
						) {

							return;

						}


						const nuevaURL =
							new URL(
								window.location.href
							);


						nuevaURL.searchParams.set(
							"local",
							localSeleccionado
						);


						window.location.href =
							nuevaURL.toString();

					}
				);

			});


		/* Orden en que se muestran las categorías en el menú (de arriba hacia abajo).
		// Cualquier categoría nueva que no esté en esta lista se agrega automáticamente al final. */

		const ORDEN_CATEGORIAS = ["Promociones", "Cafetería", "Sandwich", "Pasteles", "Bebestibles", "Dulces", "Snacks"];

		function ordenarCategorias(categorias) {
			return [...categorias].sort((a, b) => {
				const idxA = ORDEN_CATEGORIAS.indexOf(a);
				const idxB = ORDEN_CATEGORIAS.indexOf(b);
				const posA = idxA === -1 ? ORDEN_CATEGORIAS.length : idxA;
				const posB = idxB === -1 ? ORDEN_CATEGORIAS.length : idxB;
				if (posA !== posB) return posA - posB;
				return a.localeCompare(b);
			});
		}



		/* =====================================================
		   CARGA DE PRODUCTOS SEGÚN EL LOCAL
		   ===================================================== */

		if (LOCAL_ACTUAL) {

			// Agrupa varios cambios seguidos (ej. el admin editando varios productos
			// en fila) en un solo re-render, en vez de reconstruir todo el menú una
			// vez por cada cambio individual que llega de Firestore.
			let temporizadorRenderMenu = null;

			onSnapshot(
				collection(
					db,
					"locales",
					LOCAL_ACTUAL,
					"productos"
				),
				(snapshot) => {

					todosLosProductos = [];


					snapshot.forEach((docSnap) => {

						const data = docSnap.data();


						if (data.disponible) {

							todosLosProductos.push({
								id: docSnap.id,
								...data
							});

						}

					});
					
					
					
					crearFiltrosCliente(
						todosLosProductos
					);
					
					/* AQUÍ ACTIVAMOS LA PRECARGA INVISIBLE */
					precargarFotosEnSegundoPlano(todosLosProductos);


					clearTimeout(temporizadorRenderMenu);
					temporizadorRenderMenu = setTimeout(() => {

						const filtrarPorSeleccion = () =>
							filtroActualCliente === "todos"
								? todosLosProductos
								: filtroActualCliente === "__promociones__"
									? todosLosProductos.filter(p => p.promocion)
									: todosLosProductos.filter(p => p.categoria === filtroActualCliente);

						let productosAMostrar = filtrarPorSeleccion();

						// Si la categoría que estaba viendo el cliente se quedó sin productos
						// (ej. se ocultaron todos), vuelve a "Todos" en vez de mostrar el menú vacío.
						if (productosAMostrar.length === 0 && filtroActualCliente !== "todos") {

							filtroActualCliente = "todos";
							productosAMostrar = todosLosProductos;

							document
								.querySelectorAll(".filtro-cliente-btn")
								.forEach(b => b.classList.toggle("active", b.dataset.cat === "todos"));

						}

						renderizarMenuCliente(
							productosAMostrar,
							filtroActualCliente
						);

					}, 150);

				},
				(error) => {

					console.error("Error cargando el menú:", error);

					document.getElementById("menu-contenedor").innerHTML =
						"<p style='text-align:center;'>No se pudo cargar el menú. Revisa tu conexión e inténtalo de nuevo.</p>";

				}
			);

		}



		function renderizarMenuCliente(
			productos,
			filtroSeleccionado
		) {

			const contenedor =
				document.getElementById(
					"menu-contenedor"
				);


			if (productos.length === 0) {

				contenedor.innerHTML =
					"<p style='text-align:center;'>No hay productos disponibles por el momento.</p>";

				return;

			}


			let html = "";



			if (filtroSeleccionado === "todos") {

				const productosPromocion =
					productos.filter(
						p => p.promocion
					);
				
				
				
				if (productosPromocion.length > 0) {
					
					/* RECUPERAMOS EL CÁLCULO DE MÓVIL Y EL CAMBIO DE VISTA */
					const cantPromo = productosPromocion.length;
					const colPromo = Math.max(Math.min(12, cantPromo), Math.ceil(cantPromo / 3));
					const claseContenedorPromo = filtroSeleccionado === "todos" ? "productos-horizontal-scroll" : "productos-grid-vertical";
					const estiloContenedorPromo = filtroSeleccionado === "todos" ? `style="--columnas-movil: ${colPromo};"` : "";

					html += `

						<div
							class="categoria-seccion"
							id="cat-promociones"
						>

							<div class="categoria-header-row">

								<h2 class="categoria-titulo">
									🔥 Promos y novedades
								</h2>

								<span class="ver-mas-link" data-cat="__promociones__">
									Ver más ›
								</span>

							</div>

							<div class="${claseContenedorPromo}" ${estiloContenedorPromo}>
					`;


					productosPromocion.forEach(p => {

						html += crearTarjetaVertical(p);

					});


					html += `

							</div>

						</div>

					`;

				}

			}



			const categorias =
				ordenarCategorias([
					...new Set(
						productos.map(
							p => p.categoria
						)
					)
				]);



			categorias.forEach(cat => {

				const productosCat =
					productos.filter(
						p => p.categoria === cat
					);
				
				
				
				if (productosCat.length > 0) {
					
					/* RECUPERAMOS EL CÁLCULO DE MÓVIL Y EL CAMBIO DE VISTA */
					const cantCat = productosCat.length;
					const colCat = Math.max(Math.min(12, cantCat), Math.ceil(cantCat / 3));
					const claseContenedorCat = filtroSeleccionado === "todos" ? "productos-horizontal-scroll" : "productos-grid-vertical";
					const estiloContenedorCat = filtroSeleccionado === "todos" ? `style="--columnas-movil: ${colCat};"` : "";

					html += `

						<div
							class="categoria-seccion"
							id="cat-${escaparHtml(cat.replace(/\s+/g, '-'))}"
						>

							<div class="categoria-header-row">

								<h2 class="categoria-titulo">
									${escaparHtml(cat)}
								</h2>

								<span class="ver-mas-link" data-cat="${escaparHtml(cat)}">
									Ver más ›
								</span>

							</div>

							<div class="${claseContenedorCat}" ${estiloContenedorCat}>
					`;


					productosCat.forEach(p => {

						html += crearTarjetaVertical(p);

					});


					html += `

							</div>

						</div>

					`;

				}

			});


			contenedor.innerHTML = html;

		}
		
		
		function crearTarjetaVertical(p) {

			const nombreSeguro = escaparHtml(p.nombre);
			const descripcionSegura = escaparHtml(p.descripcion || '');
			const imagenSegura = escaparHtml(p.imagenUrl || 'img/logo.png');

            // Lógica de etiquetas: Si está agotado gana el cartel gris. Si no, revisa si es promo.
            let etiquetaHtml = '';
            if (p.agotado) {
                etiquetaHtml = '<span class="badge-agotado-v">Agotado</span>';
            } else if (p.promocion) {
                etiquetaHtml = '<span class="badge-promocion-v">Oferta</span>';
            }

			return `

				<div
					class="producto-card-vertical ${p.agotado ? 'agotado' : ''}"
					data-producto-id="${p.id}"
				>

                    ${etiquetaHtml}

					<div class="producto-img-container">

						<img
							src="${imagenSegura}"
							alt="${nombreSeguro}"
							class="producto-imagen-v"
							loading="lazy"
							decoding="async"
						>

					</div>


					<div class="producto-nombre-v">
						${nombreSeguro}
					</div>


					<div class="producto-descripcion-v">
						${descripcionSegura}
					</div>
					
					
					<div class="producto-footer-v">

						<div class="producto-precio-v ${p.agotado ? 'precio-tachado' : ''}">
							$${Number(p.precio).toLocaleString('es-CL')}
						</div>

					</div>

				</div>

			`;

		}



		function crearFiltrosCliente(productos) {

			const categorias =
				ordenarCategorias([
					...new Set(
						productos.map(
							p => p.categoria
						)
					)
				]);


			const nav =
				document.getElementById(
					"cliente-categoria-nav"
				);


			let html = `

				<button
					class="filtro-cliente-btn ${filtroActualCliente === "todos" ? "active" : ""}"
					data-cat="todos"
				>
					Todos
				</button>

			`;


			categorias.forEach(cat => {

				html += `

					<button
						class="filtro-cliente-btn ${cat === filtroActualCliente ? "active" : ""}"
						data-cat="${escaparHtml(cat)}"
					>
						${escaparHtml(cat)}
					</button>

				`;

			});


			nav.innerHTML = html;



			document
				.querySelectorAll(
					".filtro-cliente-btn"
				)
				.forEach(btn => {


					btn.addEventListener(
						"click",
						() => {


							document
								.querySelectorAll(
									".filtro-cliente-btn"
								)
								.forEach(b =>
									b.classList.remove(
										"active"
									)
								);


							btn.classList.add(
								"active"
							);


							const categoriaSel =
								btn.dataset.cat;

							filtroActualCliente = categoriaSel;


							if (
								categoriaSel ===
								"todos"
							) {

								renderizarMenuCliente(
									todosLosProductos,
									"todos"
								);

							}

							else {

								const filtrados =
									todosLosProductos.filter(
										p =>
											p.categoria ===
											categoriaSel
									);


								renderizarMenuCliente(
									filtrados,
									categoriaSel
								);

							}

						}
					);

				});

		}



		/* =====================================================
		   POPUP DE PRODUCTO
		   ===================================================== */

		const productoPopupOverlay =
			document.getElementById(
				"producto-popup-overlay"
			);


		const productoPopupCerrar =
			document.getElementById(
				"producto-popup-cerrar"
			);


		const popupProductoContenido =
			document.getElementById(
				"popup-producto-contenido"
			);


		/* ===== ESTADO DEL CARRUSEL DEL POPUP ===== */

		let imagenesPopupActuales = [];

		let indicePopupActual = 0;

		/* ===== CONTROL DE CARGAS DEL POPUP ===== */

		let popupCargaId = 0;



		/* ===== ABRIR POPUP ===== */

		function abrirProductoPopup(producto) {

			if (!producto) return;


			const nombre =
				escaparHtml(producto.nombre || "Producto");


			const descripcion =
				escaparHtml(
					producto.descripcion ||
					"Sin descripción disponible."
				);


			const precio =
				Number(
					producto.precio || 0
				).toLocaleString(
					"es-CL"
				);


			/* Si el producto tiene fotos de variedades (imagenesExtra), el carrusel
			   muestra SOLO esas — la foto principal (imagenUrl) es exclusiva del menú.
			   Si no tiene variedades, se usa la principal como respaldo. */

			imagenesPopupActuales =
				Array.isArray(producto.imagenesExtra) && producto.imagenesExtra.length > 0
				? producto.imagenesExtra
				: [producto.imagenUrl].filter(Boolean);


			if (imagenesPopupActuales.length === 0) {

				imagenesPopupActuales = ["img/logo.png"];

			}


			indicePopupActual = 0;

			/* Invalida cualquier carga anterior que todavía pudiera estar pendiente */
			popupCargaId++;


			// Precarga todas las fotos del carrusel para que cambiar entre ellas sea instantáneo
			imagenesPopupActuales.forEach(url => {
				const imgPrecarga = new Image();
				imgPrecarga.src = url;
			});


			const hayVariasFotos =
				imagenesPopupActuales.length > 1;


			popupProductoContenido.innerHTML = `

				<div class="producto-popup-imagen-container">

					<div class="popup-imagen-spinner" id="popup-imagen-spinner"></div>

					<img
						src="${escaparHtml(imagenesPopupActuales[0])}"
						alt="${nombre}"
						class="producto-popup-imagen"
						id="popup-imagen-actual"
					>

					${
						hayVariasFotos
						? `
							<button
								class="popup-carrusel-flecha izq"
								id="popup-flecha-izq"
								aria-label="Foto anterior"
							>‹</button>

							<button
								class="popup-carrusel-flecha der"
								id="popup-flecha-der"
								aria-label="Foto siguiente"
							>›</button>
						`
						: ''
					}

				</div>


				${
					hayVariasFotos
					? `
						<div
							class="popup-carrusel-puntos"
							id="popup-carrusel-puntos"
						>
							${
								imagenesPopupActuales
									.map((_, i) => `
										<span
											class="popup-carrusel-punto ${i === 0 ? 'activo' : ''}"
											data-indice="${i}"
										></span>
									`)
									.join('')
							}
						</div>
					`
					: ''
				}


				${
					producto.promocion
					?
					`
						<div class="producto-popup-badge">
							🔥 Oferta
						</div>
					`
					:
					''
				}


				<h2
					class="producto-popup-nombre"
					id="popup-producto-nombre"
				>
					${nombre}
				</h2>


				<p class="producto-popup-descripcion">
					${descripcion}
				</p>


				<p class="producto-popup-precio">
					$${precio}
				</p>

			`;


			/* =====================================================
			   CARGA SEGURA DE LA PRIMERA IMAGEN
			   Evita que una carga antigua pueda dejar bloqueado
			   el carrusel después de cerrar y volver a abrir.
			   ===================================================== */

			const imgActualPopup = document.getElementById("popup-imagen-actual");
			const spinnerActualPopup = document.getElementById("popup-imagen-spinner");

			const cargaPopupActual = popupCargaId;

			function marcarImagenPopupCargada() {

				if (cargaPopupActual !== popupCargaId) {
					return;
				}

				if (
					imgActualPopup &&
					document.getElementById("popup-imagen-actual") === imgActualPopup
				) {

					imgActualPopup.classList.add("cargada");

					if (spinnerActualPopup) {
						spinnerActualPopup.classList.add("oculto");
					}

				}

			}


			imgActualPopup.addEventListener(
				"load",
				marcarImagenPopupCargada
			);

			imgActualPopup.addEventListener(
				"error",
				marcarImagenPopupCargada
			);


			if (imgActualPopup.complete) {

				marcarImagenPopupCargada();

			}



			if (hayVariasFotos) {

				document
					.getElementById("popup-flecha-izq")
					.addEventListener("click", () => cambiarImagenPopup(-1));

				document
					.getElementById("popup-flecha-der")
					.addEventListener("click", () => cambiarImagenPopup(1));

				document
					.querySelectorAll(".popup-carrusel-punto")
					.forEach(punto => {

						punto.addEventListener("click", () => {

							indicePopupActual =
								Number(punto.dataset.indice);

							actualizarImagenPopup();

						});

					});

			}


			productoPopupOverlay.classList.add(
				"mostrar"
			);


			document.body.style.overflow =
				"hidden";

		}



		/* ===== CAMBIAR DE FOTO EN EL CARRUSEL ===== */

		function cambiarImagenPopup(direccion) {

			indicePopupActual =
				(
					indicePopupActual +
					direccion +
					imagenesPopupActuales.length
				) % imagenesPopupActuales.length;


			actualizarImagenPopup();

		}


		function actualizarImagenPopup() {

			const img = document.getElementById("popup-imagen-actual");
			const spinner = document.getElementById("popup-imagen-spinner");

			if (!img) return;


			/* Cada cambio de imagen obtiene un ID de carga nuevo */
			const cargaActual = ++popupCargaId;


			img.classList.remove("cargada");

			if (spinner) {
				spinner.classList.remove("oculto");
			}


			const nuevaUrl =
				imagenesPopupActuales[indicePopupActual];


			/* Registramos los eventos ANTES de cambiar src */
			img.onload = () => {

				if (cargaActual !== popupCargaId) {
					return;
				}

				if (
					document.getElementById("popup-imagen-actual") !== img
				) {
					return;
				}

				img.classList.add("cargada");

				if (spinner) {
					spinner.classList.add("oculto");
				}

			};


			img.onerror = () => {

				if (cargaActual !== popupCargaId) {
					return;
				}

				if (
					document.getElementById("popup-imagen-actual") !== img
				) {
					return;
				}

				img.classList.add("cargada");

				if (spinner) {
					spinner.classList.add("oculto");
				}

			};


			img.src = nuevaUrl;


			/*
				Si la imagen ya estaba en caché del navegador,
				complete puede ser true inmediatamente.
			*/

			if (img.complete) {

				if (cargaActual === popupCargaId) {

					img.classList.add("cargada");

					if (spinner) {
						spinner.classList.add("oculto");
					}

				}

			}


			document
				.querySelectorAll(".popup-carrusel-punto")
				.forEach((punto, i) => {

					punto.classList.toggle(
						"activo",
						i === indicePopupActual
					);

				});

		}



/* ===== CERRAR POPUP ===== */

		function cerrarProductoPopup() {

			/* Invalida cualquier carga que todavía esté pendiente */
			popupCargaId++;


			productoPopupOverlay.classList.remove(
				"mostrar"
			);


			document.body.style.overflow =
				"";

		}


		/* ===== ABRIR/CERRAR BARRA DE CATEGORÍAS ===== */
		const btnCategoriasToggle = document.querySelector(".btn-categorias-menu");
		const navCategoriasContenedor = document.getElementById("cliente-categoria-nav");

		if (btnCategoriasToggle && navCategoriasContenedor) {
			btnCategoriasToggle.addEventListener("click", () => {
				// Almacena o quita el estado 'activo' y 'mostrar' como si fuera un interruptor
				btnCategoriasToggle.classList.toggle("activo");
				navCategoriasContenedor.classList.toggle("mostrar");
			});
		}


		/* ===== TOCAR "VER MÁS" DE UNA CATEGORÍA ===== */

		document
			.getElementById("menu-contenedor")
			.addEventListener(
				"click",
				(evento) => {

					const linkVerMas =
						evento.target.closest(
							".ver-mas-link"
						);


					if (!linkVerMas) return;


					const cat = linkVerMas.dataset.cat;

					filtroActualCliente = cat;


					const filtrados =
						cat === "__promociones__"
						? todosLosProductos.filter(p => p.promocion)
						: todosLosProductos.filter(p => p.categoria === cat);


					renderizarMenuCliente(
						filtrados,
						cat
					);


					// Sincroniza el botón de categoría activo en la barra de filtros
					document
						.querySelectorAll(".filtro-cliente-btn")
						.forEach(b => b.classList.remove("active"));

					const btnCategoria =
						document.querySelector(
							`.filtro-cliente-btn[data-cat="${CSS.escape(cat)}"]`
						);

					if (btnCategoria) btnCategoria.classList.add("active");


					window.scrollTo({ top: 0, behavior: 'smooth' });

				}
			);



		/* ===== TOCAR UNA TARJETA ===== */

		document
			.getElementById("menu-contenedor")
			.addEventListener(
				"click",
				(evento) => {

					const tarjeta =
						evento.target.closest(
							".producto-card-vertical"
						);


					if (!tarjeta) return;


					const producto =
						todosLosProductos.find(
							p =>
								p.id ===
								tarjeta.dataset.productoId
						);


					abrirProductoPopup(
						producto
					);

				}
			);



		/* ===== BOTÓN X ===== */

		productoPopupCerrar.addEventListener(
			"click",
			cerrarProductoPopup
		);



		/* ===== TOCAR FUERA DEL POPUP ===== */

		productoPopupOverlay.addEventListener(
			"click",
			(evento) => {

				if (
					evento.target ===
					productoPopupOverlay
				) {

					cerrarProductoPopup();

				}

			}
		);



		/* ===== TECLA ESC ===== */

		document.addEventListener(
			"keydown",
			(evento) => {

				if (
					evento.key === "Escape" &&
					productoPopupOverlay.classList.contains(
						"mostrar"
					)
				) {

					cerrarProductoPopup();

				}

			}
		);



		/* =====================================================
		   BURBUJA DE DIÁLOGO DE DUMBBITO
		   ===================================================== */

		const dumbbitoImg =
			document.getElementById(
				"dumbbito-img"
			);


		const dumbbitoBurbuja =
			document.getElementById(
				"dumbbito-burbuja"
			);


		let timeoutBurbuja;



		if (
			dumbbitoImg &&
			dumbbitoBurbuja
		) {

			dumbbitoImg.addEventListener(
				"click",
				() => {


					dumbbitoBurbuja.classList.add(
						"mostrar"
					);


					clearTimeout(
						timeoutBurbuja
					);


					timeoutBurbuja =
						setTimeout(
							() => {

								dumbbitoBurbuja.classList.remove(
									"mostrar"
								);

							},
							3500
						);

				}
			);

		}



		/* =====================================================
		   SCROLL HORIZONTAL CON RUEDA DEL RATÓN (PC) - MEJORADO
		   ===================================================== */
		document.addEventListener("wheel", (evento) => {
			const contenedor = evento.target.closest(".productos-horizontal-scroll");
			
			if (contenedor && evento.deltaY !== 0) {
				
				// Calcula los límites para que el usuario no se quede atascado
				const maxScroll = contenedor.scrollWidth - contenedor.clientWidth;
				const estaAlInicio = contenedor.scrollLeft <= 0 && evento.deltaY < 0;
				
				// Usamos un margen de 2px de error por las pantallas de alta resolución
				const estaAlFinal = Math.abs(contenedor.scrollLeft - maxScroll) <= 2 && evento.deltaY > 0;
				
				// Si no está en los topes extremos, convertimos el scroll vertical en horizontal
				if (!estaAlInicio && !estaAlFinal) {
					evento.preventDefault();
					// Multiplicamos por 1.5 para que el movimiento sea más rápido y agradable
					contenedor.scrollLeft += evento.deltaY * 1.5; 
				}
			}
		}, { passive: false });

	</script>

</body>
