<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Menú - Dumbbo Café</title>
	<link href="css/templatemo-style.css" rel="stylesheet" />

	<style>

    /* ===== COLORES DUMBBO ===== */
    :root {
        --rosa-dumbbo: #F0AEC9;
        --rosa-claro: #FCE8F1;
        --rosa-oscuro: #7A294D;
        --texto: #3A2630;
        --blanco: #FFFFFF;
        --precio-rojo: #E53935;
        --gris-suave: #F8F9FA;
    }

    /* ===== BLOQUEA EL ZOOM (pellizco y doble-tap) EN TODA LA PÁGINA ===== */
    html {
        touch-action: manipulation;
    }

    /* ===== FONDO GENERAL ===== */
    body {
        background-color: var(--rosa-claro);
        color: var(--texto);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Fondo Dumbbo */
        background-image: url('img/fondo.png');
        background-repeat: repeat-y;
        background-position: center top;

        /* Fondo adaptable */
        background-size: 100% auto;

        /* El fondo se mueve junto con la página */
        background-attachment: scroll;
    }


    /* ===== BANNER PRINCIPAL ===== */
    .banner-header {
        width: 100%;
        margin-bottom: 25px;
        overflow: hidden;
        background-color: var(--rosa-dumbbo);
        box-shadow: 0 4px 15px rgba(122, 41, 77, 0.12);
    }

    .banner-img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }


    /* ===== CONTENEDOR PRINCIPAL DEL MENÚ ===== */
    .menu-container {
        max-width: 950px;
        margin: 0 auto 40px auto;
        padding: 25px 20px;
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(6px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(122, 41, 77, 0.10);
        box-sizing: border-box;
    }


    /* ===== CABECERA Y TÍTULO ===== */
    .menu-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--rosa-claro);
    }

    .menu-titulo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--rosa-oscuro);
        margin: 0;
        letter-spacing: -0.5px;
    }


    /* ===== DUMBBITO AL LADO DEL TÍTULO ===== */

    .dumbbito-wrapper {
        position: relative;
        width: 160px;
        flex-shrink: 0;
    }

    .dumbbito-flotante {
        width: 100%;
        height: auto;
        display: block;
        cursor: pointer;
        transition: transform 0.15s ease;
    }

    .dumbbito-flotante:active {
        transform: scale(0.95);
    }


    /* ===== BURBUJA DE DIÁLOGO ===== */
    .dumbbito-burbuja {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(10px) scale(0.8);
        margin-bottom: 12px;
        min-width: 180px;
        max-width: 220px;
        background-color: var(--blanco);
        color: var(--rosa-oscuro);
        border: 2px solid var(--rosa-dumbbo);
        border-radius: 16px;
        padding: 12px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 6px 18px rgba(122, 41, 77, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .dumbbito-burbuja.mostrar {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
    }

    .dumbbito-burbuja::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: var(--rosa-dumbbo);
    }


    /* ===== BOTÓN Y BARRA DE CATEGORÍAS ===== */
    .categoria-bar-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .btn-categorias-menu {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        border-radius: 25px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.2);
    }

    #cliente-categoria-nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        scrollbar-width: thin;
        scrollbar-color: var(--rosa-dumbbo) transparent;
    }

    #cliente-categoria-nav::-webkit-scrollbar {
        height: 4px;
    }

    #cliente-categoria-nav::-webkit-scrollbar-thumb {
        background-color: var(--rosa-dumbbo);
        border-radius: 4px;
    }

    .filtro-cliente-btn {
        background-color: var(--rosa-claro);
        color: var(--rosa-oscuro);
        border: 1px solid var(--rosa-dumbbo);
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .filtro-cliente-btn:hover,
    .filtro-cliente-btn.active {
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border-color: var(--rosa-oscuro);
    }


    /* ===== SECCIONES Y CARRUSEL HORIZONTAL ===== */
    .categoria-seccion {
        margin-bottom: 35px;
    }

    .categoria-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .categoria-titulo {
        color: var(--rosa-oscuro);
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0;
    }

    .ver-mas-link {
        font-size: 0.85rem;
        color: #888;
        text-decoration: none;
        font-weight: 500;
    }


    /* ===== CONTENEDOR HORIZONTAL SCROLLABLE ===== */
    .productos-horizontal-scroll {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 5px 2px 15px 2px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .productos-horizontal-scroll::-webkit-scrollbar {
        display: none;
    }


    /* ===== TARJETA DE PRODUCTO ===== */
    .producto-card-vertical {
        min-width: 165px;
        width: 165px;
        flex-shrink: 0;
        background-color: var(--blanco);
        border: 1px solid #F1D3DF;
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 3px 10px rgba(122, 41, 77, 0.04);
        transition: transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        position: relative;

        /* NUEVO: indica que la tarjeta se puede tocar */
        cursor: pointer;
    }

    .producto-card-vertical:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(122, 41, 77, 0.12);
    }

    .producto-img-container {
        width: 100%;
        height: 120px;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 10px;
        background-color: var(--rosa-claro);
    }

    .producto-imagen-v {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .badge-promocion-v {
        position: absolute;
        top: 18px;
        left: 18px;
        background-color: var(--precio-rojo);
        color: var(--blanco);
        font-size: 0.65rem;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .producto-nombre-v {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--texto);
        margin-bottom: 4px;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.4em;
    }

    .producto-descripcion-v {
        font-size: 0.75rem;
        color: #777;
        margin-bottom: 10px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .producto-footer-v {
        margin-top: auto;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .producto-precio-v {
        font-size: 1rem;
        font-weight: 800;
        color: var(--precio-rojo);
    }

    .btn-agregar-v {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: var(--rosa-oscuro);
        color: var(--blanco);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
    }


    /* =====================================================
       POPUP DE PRODUCTO
       ===================================================== */

    .producto-popup-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        z-index: 99999;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .producto-popup-overlay.mostrar {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .producto-popup {
        position: relative;
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--blanco);
        border-radius: 22px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        padding: 18px;
        box-sizing: border-box;
        touch-action: manipulation;

        transform: translateY(20px) scale(0.96);
        transition: transform 0.25s ease;
    }

    .producto-popup-overlay.mostrar .producto-popup {
        transform: translateY(0) scale(1);
    }

    .producto-popup-cerrar {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: var(--rosa-oscuro);
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    .producto-popup-cerrar:active {
        transform: scale(0.92);
    }

    .producto-popup-imagen-container {
        position: relative;
        width: 100%;
        height: 300px;
        border-radius: 17px;
        overflow: hidden;
        background-color: var(--rosa-claro);
        margin-bottom: 12px;
        touch-action: manipulation;
    }

    .producto-popup-imagen {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    /* ===== FLECHAS DEL CARRUSEL DEL POPUP ===== */
    .popup-carrusel-flecha {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.88);
        border: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 1.3rem;
        font-weight: bold;
        color: var(--rosa-oscuro);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
        z-index: 2;
        touch-action: manipulation;
    }

    .popup-carrusel-flecha:active {
        transform: translateY(-50%) scale(0.92);
    }

    .popup-carrusel-flecha.izq {
        left: 10px;
    }

    .popup-carrusel-flecha.der {
        right: 10px;
    }

    /* ===== PUNTOS INDICADORES DEL CARRUSEL DEL POPUP ===== */
    .popup-carrusel-puntos {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 16px;
    }

    .popup-carrusel-punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #E3C4D3;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
        touch-action: manipulation;
    }

    .popup-carrusel-punto.activo {
        background-color: var(--rosa-oscuro);
        transform: scale(1.25);
    }

    .producto-popup-badge {
        display: inline-block;
        background-color: var(--precio-rojo);
        color: var(--blanco);
        font-size: 0.78rem;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .producto-popup-nombre {
        margin: 0 45px 10px 0;
        color: var(--rosa-oscuro);
        font-size: 1.65rem;
        line-height: 1.2;
        font-weight: 800;
    }

    .producto-popup-descripcion {
        margin: 0 0 18px 0;
        color: #666;
        font-size: 1rem;
        line-height: 1.6;
        white-space: pre-line;
    }

    .producto-popup-precio {
        color: var(--precio-rojo);
        font-size: 1.45rem;
        font-weight: 900;
        margin: 0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 992px) {

        .banner-header {
            margin-bottom: 20px;
        }

        .menu-container {
            margin: 0 10px 30px 10px;
            padding: 18px 12px;
        }


        /* =================================================
           DUMBBITO JUNTO A "MENÚ" EN DISPOSITIVOS MÓVILES
           ================================================= */

        .dumbbito-wrapper {
            position: relative;
            width: 65px;
            right: auto;
            left: auto;
            top: auto;
            transform: none;
        }

        .dumbbito-flotante {
            width: 65px;
            height: auto;

            filter: drop-shadow(
                0 3px 5px rgba(0, 0, 0, 0.15)
            );
        }


        /* ===== BURBUJA EN TELÉFONOS ===== */

        .dumbbito-wrapper .dumbbito-burbuja {
            min-width: 150px;
            max-width: 180px;

            font-size: 0.72rem;

            padding: 9px 12px;

            left: auto;
            right: 0;

            transform:
                translateY(10px)
                scale(0.8);
        }

        .dumbbito-wrapper .dumbbito-burbuja.mostrar {
            transform:
                translateY(0)
                scale(1);
        }

        .dumbbito-wrapper .dumbbito-burbuja::after {
            left: auto;
            right: 20px;
            transform: none;
        }


        /* ===== PRODUCTOS EN MÓVIL ===== */

        .producto-card-vertical {
            min-width: 145px;
            width: 145px;
            padding: 10px;
        }

        .producto-img-container {
            height: 105px;
        }


        /* ===== POPUP EN MÓVIL ===== */

        .producto-popup-overlay {
            padding: 15px;
        }

        .producto-popup {
            max-width: 100%;
            max-height: 88vh;
            border-radius: 20px;
            padding: 14px;
        }

        .producto-popup-imagen-container {
            height: 240px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .producto-popup-nombre {
            font-size: 1.4rem;
        }

        .producto-popup-descripcion {
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .producto-popup-precio {
            font-size: 1.3rem;
        }

    }


    /* ===== TELÉFONOS PEQUEÑOS ===== */

    @media (max-width: 480px) {

        .dumbbito-wrapper {
            width: 58px;
        }

        .dumbbito-flotante {
            width: 58px;
        }

        .dumbbito-wrapper .dumbbito-burbuja {
            min-width: 145px;
            max-width: 165px;
            font-size: 0.70rem;
        }


        /* ===== POPUP TELÉFONOS PEQUEÑOS ===== */

        .producto-popup-overlay {
            padding: 10px;
        }

        .producto-popup {
            max-height: 90vh;
            padding: 12px;
            border-radius: 18px;
        }

        .producto-popup-imagen-container {
            height: 210px;
        }

        .producto-popup-nombre {
            font-size: 1.25rem;
        }

        .producto-popup-descripcion {
            font-size: 0.88rem;
        }

        .producto-popup-precio {
            font-size: 1.2rem;
        }

        .producto-popup-cerrar {
            width: 36px;
            height: 36px;
            font-size: 1.35rem;
        }

    }


    /* =====================================================
       FOOTER DUMBBO
       ===================================================== */

    .dumbbo-footer {
        width: 100%;
        min-height: 300px;
        background-color: #7A294D;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 35px 6%;
        margin-top: 40px;
    }

    .dumbbo-footer-contenido {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: center;
        gap: 50px;
    }


    /* ===== LOGO ===== */

    .dumbbo-footer-logo {
        height: 180px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
        margin: 0 auto;
    }


    /* ===== COLUMNAS ===== */

    .dumbbo-footer-columna {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .dumbbo-footer-titulo {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 18px 0;
        color: #FFFFFF;
    }

    .dumbbo-footer-texto {
        font-size: 1rem;
        line-height: 1.8;
        margin: 0;
        color: #FFFFFF;
    }


    /* ===== TEXTO INFERIOR ===== */

    .dumbbo-footer-final {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 0.85rem;
        margin-top: 10px;
        color: #FFFFFF;
        opacity: 0.9;
    }


    /* ===== FOOTER RESPONSIVE ===== */

    @media (max-width: 768px) {

        .dumbbo-footer {
            min-height: auto;
            padding: 40px 25px;
        }

        .dumbbo-footer-contenido {
            grid-template-columns: 1fr;
            text-align: center;
            gap: 30px;
        }

        .dumbbo-footer-logo {
            height: 150px;
            margin: 0 auto;
        }

        .dumbbo-footer-columna {
            align-items: center;
        }

        .dumbbo-footer-titulo {
            font-size: 1.3rem;
        }

    }

	</style>
</head>

<body>


	<!-- =====================================================
	     BANNER SUPERIOR
	     ===================================================== -->

	<div class="banner-header">

		<img
			src="img/banner.jpg"
			alt="Dumbbo Café Banner"
			class="banner-img"
		>

	</div>



	<!-- =====================================================
	     RECUADRO DEL MENÚ
	     ===================================================== -->

	<div class="menu-container">

		<div class="menu-header-bar">

			<h1 class="menu-titulo">
				Menú
			</h1>


			<!-- =================================================
			     DUMBBITO
			     Ahora forma parte de la cabecera del menú
			     ================================================= -->

			<div class="dumbbito-wrapper">

				<div
					class="dumbbito-burbuja"
					id="dumbbito-burbuja"
				>
					Disfruta de nuestro nuevo menú digital 🐘☕
				</div>


				<img
					src="img/dumbbito.png"
					alt="Dumbbito"
					class="dumbbito-flotante"
					id="dumbbito-img"
				>

			</div>

		</div>


		<div class="categoria-bar-wrapper">

			<button class="btn-categorias-menu">
				<span>≡</span>
				Categorías
			</button>

			<div id="cliente-categoria-nav"></div>

		</div>


		<div id="menu-contenedor"></div>

	</div>



	<!-- =====================================================
	     POPUP DE PRODUCTO
	     ===================================================== -->

	<div
		class="producto-popup-overlay"
		id="producto-popup-overlay"
	>

		<div
			class="producto-popup"
			role="dialog"
			aria-modal="true"
			aria-labelledby="popup-producto-nombre"
		>

			<button
				class="producto-popup-cerrar"
				id="producto-popup-cerrar"
				aria-label="Cerrar"
			>
				×
			</button>

			<div id="popup-producto-contenido"></div>

		</div>

	</div>



	<!-- =====================================================
	     FOOTER DUMBBO
	     ===================================================== -->

	<footer class="dumbbo-footer">

		<div class="dumbbo-footer-contenido">


			<!-- Logo -->

			<div class="dumbbo-footer-columna">

				<img
					src="img/logo1.png"
					alt="Dumbbo Café"
					class="dumbbo-footer-logo"
				>

			</div>


			<!-- Información -->

			<div class="dumbbo-footer-columna">

				<h2 class="dumbbo-footer-titulo">
					Dumbbo Café
				</h2>

				<p class="dumbbo-footer-texto">
					Disfruta de nuestro menú<br>
					y vive la experiencia Dumbbo 🐘☕
				</p>

			</div>


			<!-- Espacio visual -->

			<div class="dumbbo-footer-columna">
			</div>


			<!-- Copyright -->

			<div class="dumbbo-footer-final">

				© 2026 Dumbbo Café

			</div>


		</div>

	</footer>



	<!-- =====================================================
	     FIREBASE + JAVASCRIPT
	     ===================================================== -->

	<script type="module">

		import {
			initializeApp
		}
		from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";


		import {
			getFirestore,
			collection,
			onSnapshot
		}
		from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";



		const firebaseConfig = {

			apiKey: "AIzaSyDEhG5JEj8s2GMQgdceHY3LeUa_32jx_MI",

			authDomain: "dumbbo-menu.firebaseapp.com",

			projectId: "dumbbo-menu",

			storageBucket: "dumbbo-menu.firebasestorage.app",

			messagingSenderId: "875230670130",

			appId: "1:875230670130:web:63ad4fb93cb7bf2c8bbb2b"

		};



		const app = initializeApp(firebaseConfig);

		const db = getFirestore(app);


		let todosLosProductos = [];



		onSnapshot(
			collection(db, "productos"),
			(snapshot) => {

				todosLosProductos = [];


				snapshot.forEach((docSnap) => {

					const data = docSnap.data();


					if (data.disponible) {

						todosLosProductos.push({
							id: docSnap.id,
							...data
						});

					}

				});


				crearFiltrosCliente(todosLosProductos);

				renderizarMenuCliente(
					todosLosProductos,
					"todos"
				);

			}
		);



		function renderizarMenuCliente(
			productos,
			filtroSeleccionado
		) {

			const contenedor =
				document.getElementById(
					"menu-contenedor"
				);


			if (productos.length === 0) {

				contenedor.innerHTML =
					"<p style='text-align:center;'>No hay productos disponibles por el momento.</p>";

				return;

			}


			let html = "";



			if (filtroSeleccionado === "todos") {

				const productosPromocion =
					productos.filter(
						p => p.promocion
					);


				if (productosPromocion.length > 0) {

					html += `

						<div
							class="categoria-seccion"
							id="cat-promociones"
						>

							<div class="categoria-header-row">

								<h2 class="categoria-titulo">
									🔥 Promos y novedades
								</h2>

								<span class="ver-mas-link">
									Ver más ›
								</span>

							</div>


							<div class="productos-horizontal-scroll">
					`;


					productosPromocion.forEach(p => {

						html += crearTarjetaVertical(p);

					});


					html += `

							</div>

						</div>

					`;

				}

			}



			const categorias =
				[
					...new Set(
						productos.map(
							p => p.categoria
						)
					)
				];



			categorias.forEach(cat => {

				const productosCat =
					productos.filter(
						p => p.categoria === cat
					);


				if (productosCat.length > 0) {

					html += `

						<div
							class="categoria-seccion"
							id="cat-${cat.replace(/\s+/g, '-')}"
						>

							<div class="categoria-header-row">

								<h2 class="categoria-titulo">
									${cat}
								</h2>

								<span class="ver-mas-link">
									Ver más ›
								</span>

							</div>


							<div class="productos-horizontal-scroll">
					`;


					productosCat.forEach(p => {

						html += crearTarjetaVertical(p);

					});


					html += `

							</div>

						</div>

					`;

				}

			});


			contenedor.innerHTML = html;

		}



		function crearTarjetaVertical(p) {

			return `

				<div
					class="producto-card-vertical"
					data-producto-id="${p.id}"
				>

					${
						p.promocion
						?
						'<span class="badge-promocion-v">Oferta</span>'
						:
						''
					}


					<div class="producto-img-container">

						<img
							src="${p.imagenUrl || 'img/logo.png'}"
							alt="${p.nombre}"
							class="producto-imagen-v"
						>

					</div>


					<div class="producto-nombre-v">
						${p.nombre}
					</div>


					<div class="producto-descripcion-v">
						${p.descripcion || ''}
					</div>


					<div class="producto-footer-v">

						<div class="producto-precio-v">
							$${Number(p.precio).toLocaleString('es-CL')}
						</div>

					</div>

				</div>

			`;

		}



		function crearFiltrosCliente(productos) {

			const categorias =
				[
					...new Set(
						productos.map(
							p => p.categoria
						)
					)
				];


			const nav =
				document.getElementById(
					"cliente-categoria-nav"
				);


			let html = `

				<button
					class="filtro-cliente-btn active"
					data-cat="todos"
				>
					Todos
				</button>

			`;


			categorias.forEach(cat => {

				html += `

					<button
						class="filtro-cliente-btn"
						data-cat="${cat}"
					>
						${cat}
					</button>

				`;

			});


			nav.innerHTML = html;



			document
				.querySelectorAll(
					".filtro-cliente-btn"
				)
				.forEach(btn => {


					btn.addEventListener(
						"click",
						() => {


							document
								.querySelectorAll(
									".filtro-cliente-btn"
								)
								.forEach(b =>
									b.classList.remove(
										"active"
									)
								);


							btn.classList.add(
								"active"
							);


							const categoriaSel =
								btn.dataset.cat;


							if (
								categoriaSel ===
								"todos"
							) {

								renderizarMenuCliente(
									todosLosProductos,
									"todos"
								);

							}

							else {

								const filtrados =
									todosLosProductos.filter(
										p =>
											p.categoria ===
											categoriaSel
									);


								renderizarMenuCliente(
									filtrados,
									categoriaSel
								);

							}

						}
					);

				});

		}



		/* =====================================================
		   POPUP DE PRODUCTO
		   ===================================================== */

		const productoPopupOverlay =
			document.getElementById(
				"producto-popup-overlay"
			);


		const productoPopupCerrar =
			document.getElementById(
				"producto-popup-cerrar"
			);


		const popupProductoContenido =
			document.getElementById(
				"popup-producto-contenido"
			);


		/* ===== ESTADO DEL CARRUSEL DEL POPUP ===== */

		let imagenesPopupActuales = [];

		let indicePopupActual = 0;



		/* ===== ESCAPA TEXTO PARA EVITAR HTML NO DESEADO ===== */

		function escaparHtml(texto) {

			return String(texto ?? "")
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#039;");

		}



		/* ===== ABRIR POPUP ===== */

		function abrirProductoPopup(producto) {

			if (!producto) return;


			const nombre =
				escaparHtml(producto.nombre || "Producto");


			const descripcion =
				escaparHtml(
					producto.descripcion ||
					"Sin descripción disponible."
				);


			const precio =
				Number(
					producto.precio || 0
				).toLocaleString(
					"es-CL"
				);


			/* Si el producto tiene fotos de variedades (imagenesExtra), el carrusel
			   muestra SOLO esas — la foto principal (imagenUrl) es exclusiva del menú.
			   Si no tiene variedades, se usa la principal como respaldo. */

			imagenesPopupActuales =
				Array.isArray(producto.imagenesExtra) && producto.imagenesExtra.length > 0
				? producto.imagenesExtra
				: [producto.imagenUrl].filter(Boolean);


			if (imagenesPopupActuales.length === 0) {

				imagenesPopupActuales = ["img/logo.png"];

			}


			indicePopupActual = 0;


			const hayVariasFotos =
				imagenesPopupActuales.length > 1;


			popupProductoContenido.innerHTML = `

				<div class="producto-popup-imagen-container">

					<img
						src="${imagenesPopupActuales[0]}"
						alt="${nombre}"
						class="producto-popup-imagen"
						id="popup-imagen-actual"
					>

					${
						hayVariasFotos
						? `
							<button
								class="popup-carrusel-flecha izq"
								id="popup-flecha-izq"
								aria-label="Foto anterior"
							>‹</button>

							<button
								class="popup-carrusel-flecha der"
								id="popup-flecha-der"
								aria-label="Foto siguiente"
							>›</button>
						`
						: ''
					}

				</div>


				${
					hayVariasFotos
					? `
						<div
							class="popup-carrusel-puntos"
							id="popup-carrusel-puntos"
						>
							${
								imagenesPopupActuales
									.map((_, i) => `
										<span
											class="popup-carrusel-punto ${i === 0 ? 'activo' : ''}"
											data-indice="${i}"
										></span>
									`)
									.join('')
							}
						</div>
					`
					: ''
				}


				${
					producto.promocion
					?
					`
						<div class="producto-popup-badge">
							🔥 Oferta
						</div>
					`
					:
					''
				}


				<h2
					class="producto-popup-nombre"
					id="popup-producto-nombre"
				>
					${nombre}
				</h2>


				<p class="producto-popup-descripcion">
					${descripcion}
				</p>


				<p class="producto-popup-precio">
					$${precio}
				</p>

			`;


			if (hayVariasFotos) {

				document
					.getElementById("popup-flecha-izq")
					.addEventListener("click", () => cambiarImagenPopup(-1));

				document
					.getElementById("popup-flecha-der")
					.addEventListener("click", () => cambiarImagenPopup(1));

				document
					.querySelectorAll(".popup-carrusel-punto")
					.forEach(punto => {

						punto.addEventListener("click", () => {

							indicePopupActual =
								Number(punto.dataset.indice);

							actualizarImagenPopup();

						});

					});

			}


			productoPopupOverlay.classList.add(
				"mostrar"
			);


			document.body.style.overflow =
				"hidden";

		}



		/* ===== CAMBIAR DE FOTO EN EL CARRUSEL ===== */

		function cambiarImagenPopup(direccion) {

			indicePopupActual =
				(
					indicePopupActual +
					direccion +
					imagenesPopupActuales.length
				) % imagenesPopupActuales.length;


			actualizarImagenPopup();

		}


		function actualizarImagenPopup() {

			document.getElementById(
				"popup-imagen-actual"
			).src =
				imagenesPopupActuales[indicePopupActual];


			document
				.querySelectorAll(".popup-carrusel-punto")
				.forEach((punto, i) => {

					punto.classList.toggle(
						"activo",
						i === indicePopupActual
					);

				});

		}



		/* ===== CERRAR POPUP ===== */

		function cerrarProductoPopup() {

			productoPopupOverlay.classList.remove(
				"mostrar"
			);


			document.body.style.overflow =
				"";

		}



		/* ===== TOCAR UNA TARJETA ===== */

		document
			.getElementById("menu-contenedor")
			.addEventListener(
				"click",
				(evento) => {

					const tarjeta =
						evento.target.closest(
							".producto-card-vertical"
						);


					if (!tarjeta) return;


					const producto =
						todosLosProductos.find(
							p =>
								p.id ===
								tarjeta.dataset.productoId
						);


					abrirProductoPopup(
						producto
					);

				}
			);



		/* ===== BOTÓN X ===== */

		productoPopupCerrar.addEventListener(
			"click",
			cerrarProductoPopup
		);



		/* ===== TOCAR FUERA DEL POPUP ===== */

		productoPopupOverlay.addEventListener(
			"click",
			(evento) => {

				if (
					evento.target ===
					productoPopupOverlay
				) {

					cerrarProductoPopup();

				}

			}
		);



		/* ===== TECLA ESC ===== */

		document.addEventListener(
			"keydown",
			(evento) => {

				if (
					evento.key === "Escape" &&
					productoPopupOverlay.classList.contains(
						"mostrar"
					)
				) {

					cerrarProductoPopup();

				}

			}
		);



		/* =====================================================
		   BURBUJA DE DIÁLOGO DE DUMBBITO
		   ===================================================== */

		const dumbbitoImg =
			document.getElementById(
				"dumbbito-img"
			);


		const dumbbitoBurbuja =
			document.getElementById(
				"dumbbito-burbuja"
			);


		let timeoutBurbuja;



		if (
			dumbbitoImg &&
			dumbbitoBurbuja
		) {

			dumbbitoImg.addEventListener(
				"click",
				() => {


					dumbbitoBurbuja.classList.add(
						"mostrar"
					);


					clearTimeout(
						timeoutBurbuja
					);


					timeoutBurbuja =
						setTimeout(
							() => {

								dumbbitoBurbuja.classList.remove(
									"mostrar"
								);

							},
							3500
						);

				}
			);

		}

	</script>

</body>
</html>
