<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Elige tu local - Dumbbo Café</title>
	<meta name="description" content="Selecciona tu local de Dumbbo Café para ver el menú." />

	<link rel="icon" type="image/png" href="img/logo-rosa2.png" />
	<link rel="apple-touch-icon" href="img/logo-rosa2.png" />

	<style>
		:root {
			--rosa-dumbbo: #F0AEC9;
			--rosa-claro: #FCE8F1;
			--rosa-oscuro: #7A294D;
			--blanco: #FFFFFF;
		}

		html { touch-action: manipulation; }

		body {
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			box-sizing: border-box;
			background-color: var(--rosa-claro);
			background-image: url('img/fondo.png');
			background-repeat: repeat-y;
			background-position: center top;
			background-size: 100% auto;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			-webkit-user-select: none;
			user-select: none;
		}

		.selector-local-contenedor {
			width: 100%;
			max-width: 430px;
			background-color: rgba(255, 255, 255, 0.97);
			backdrop-filter: blur(6px);
			-webkit-backdrop-filter: blur(6px);
			border-radius: 24px;
			padding: 32px 24px;
			box-sizing: border-box;
			text-align: center;
			box-shadow: 0 12px 40px rgba(122, 41, 77, 0.18);
		}

		.selector-local-titulo {
			margin: 0 0 8px 0;
			color: var(--rosa-oscuro);
			font-size: 2rem;
			font-weight: 800;
		}

		.selector-local-subtitulo {
			margin: 0 0 28px 0;
			color: #8A6B78;
			font-size: 0.98rem;
			font-weight: 500;
		}

		.selector-local-lista {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.selector-local-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			min-height: 58px;
			border: 2px solid var(--rosa-dumbbo);
			border-radius: 16px;
			background-color: var(--blanco);
			color: var(--rosa-oscuro);
			font-size: 1.05rem;
			font-weight: 800;
			text-decoration: none;
			cursor: pointer;
			transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
			box-shadow: 0 3px 10px rgba(122, 41, 77, 0.06);
			touch-action: manipulation;
			box-sizing: border-box;
		}

		@media (hover: hover) {
			.selector-local-btn:hover {
				background-color: var(--rosa-oscuro);
				color: var(--blanco);
				border-color: var(--rosa-oscuro);
				box-shadow: 0 6px 15px rgba(122, 41, 77, 0.16);
			}
		}

		.selector-local-btn:active { transform: scale(0.97); }
	</style>
</head>
<body>

	<main class="selector-local-contenedor">

		<h1 class="selector-local-titulo">Dumbbo Café</h1>

		<p class="selector-local-subtitulo">Selecciona tu local para ver el menú</p>

		<nav class="selector-local-lista">
			<a class="selector-local-btn" href="index.html?local=GHU">GHU</a>
			<a class="selector-local-btn" href="index.html?local=VK1">VK1</a>
			<a class="selector-local-btn" href="index.html?local=Duoc">Duoc</a>
		</nav>

	</main>

	<script>
		// replace(): el selector no queda en el historial, así "atrás" desde el menú no vuelve aquí.
		document.querySelectorAll(".selector-local-btn").forEach(function (enlace) {
			enlace.addEventListener("click", function (e) {
				e.preventDefault();
				location.replace(enlace.getAttribute("href"));
			});
		});
	</script>

</body>
</html>
