<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin - Dumbbo Café</title>
	<link href="css/templatemo-style.css" rel="stylesheet" />

	<style>

		:root {
			--rosa-dumbbo: #F0AEC9;
			--rosa-claro: #FCE8F1;
			--rosa-oscuro: #7A294D;
			--texto: #3A2630;
			--blanco: #FFFFFF;
			--rojo: #E53935;
			--verde: #2E7D32;
			--verde-bg: #E8F5E9;
			--rojo-bg: #FFEBEE;
		}


		body {
			background-color: var(--rosa-claro);
			color: var(--texto);
			background-image: url('img/logo1.png');
			background-repeat: no-repeat;
			background-position: center center;
			background-attachment: fixed;
			background-size: 85vw auto;
			font-family: system-ui, -apple-system, sans-serif;
			margin: 0;
			padding: 20px;
		}


		#admin-login,
		#admin-panel {
			background-color: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(8px);
		}


		#admin-login {
			max-width: 450px;
			margin: 60px auto;
			padding: 30px;
			border-radius: 20px;
			box-shadow: 0 8px 25px rgba(122, 41, 77, 0.15);
			text-align: center;
		}


		#admin-panel {
			max-width: 1000px;
			margin: 40px auto;
			padding: 30px;
			border-radius: 20px;
			box-shadow: 0 8px 25px rgba(122, 41, 77, 0.15);
		}


		.admin-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			border-bottom: 2px solid var(--rosa-claro);
			padding-bottom: 15px;
		}


		.admin-header h2 {
			margin: 0;
			color: var(--rosa-oscuro);
			font-size: 1.6rem;
		}


		/* =====================================================
		   FORMULARIO
		   ===================================================== */

		.form-crear-producto {
			background-color: #FFF9FB;
			border: 1px solid #F1D3DF;
			border-radius: 15px;
			padding: 20px;
			margin-bottom: 30px;
		}


		.form-crear-producto h3 {
			margin-top: 0;
			margin-bottom: 15px;
			color: var(--rosa-oscuro);
			font-size: 1.2rem;
		}


		.form-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 12px;
			margin-bottom: 15px;
		}


		.form-crear-producto input[type="text"],
		.form-crear-producto input[type="number"],
		.form-crear-producto select,
		.form-crear-producto textarea {
			padding: 10px;
			border: 1px solid #DFA5BB;
			border-radius: 8px;
			outline: none;
			width: 100%;
			box-sizing: border-box;
			font-size: 0.9rem;
			background-color: #FFF;
		}


		/* ===== CAMPO NUEVA CATEGORÍA ===== */

		.nueva-categoria-container {
			display: none;
			flex-direction: column;
			gap: 5px;
		}


		.nueva-categoria-container.mostrar {
			display: flex;
		}


		.nueva-categoria-label {
			font-size: 0.8rem;
			font-weight: bold;
			color: var(--rosa-oscuro);
		}


		#nueva-categoria-input {
			padding: 10px;
			border: 1px solid var(--rosa-dumbbo);
			border-radius: 8px;
			outline: none;
			width: 100%;
			box-sizing: border-box;
			font-size: 0.9rem;
			background-color: #FFF;
		}


		#nueva-categoria-input:focus {
			border-color: var(--rosa-oscuro);
			box-shadow: 0 0 0 2px rgba(240, 174, 201, 0.25);
		}


		.input-file-container {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}


		.input-file-container label {
			font-size: 0.85rem;
			color: var(--rosa-oscuro);
			font-weight: bold;
		}


		.form-crear-producto input[type="file"] {
			padding: 6px;
			border: 1px dashed #DFA5BB;
			border-radius: 8px;
			background-color: #FFF;
			cursor: pointer;
			width: 100%;
			box-sizing: border-box;
			font-size: 0.85rem;
		}


		.form-crear-producto textarea {
			grid-column: 1 / -1;
			resize: vertical;
			height: 60px;
		}


		.form-checkboxes {
			display: flex;
			gap: 20px;
			align-items: center;
			margin-bottom: 15px;
			background-color: var(--rosa-claro);
			padding: 10px 15px;
			border-radius: 10px;
		}


		.form-checkboxes label {
			display: flex;
			align-items: center;
			gap: 8px;
			font-weight: bold;
			color: var(--rosa-oscuro);
			cursor: pointer;
			font-size: 0.9rem;
		}


		/* =====================================================
		   BOTONES DE FILTRO
		   ===================================================== */

		.apartados-bar {
			display: flex;
			gap: 8px;
			margin-bottom: 20px;
			flex-wrap: wrap;
		}


		.btn-apartado {
			background-color: var(--rosa-claro);
			color: var(--rosa-oscuro);
			border: 1px solid var(--rosa-dumbbo);
			padding: 8px 16px;
			border-radius: 20px;
			cursor: pointer;
			font-weight: 600;
			font-size: 0.85rem;
			transition: all 0.2s;
		}


		.btn-apartado.active,
		.btn-apartado:hover {
			background-color: var(--rosa-oscuro);
			color: var(--blanco);
			border-color: var(--rosa-oscuro);
		}


		/* =====================================================
		   TABLA
		   ===================================================== */

		.tabla-container {
			overflow-x: auto;
			border-radius: 12px;
			border: 1px solid #F1D3DF;
		}


		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
			background-color: #FFF;
		}


		th {
			background-color: #FCE8F1;
			color: var(--rosa-oscuro);
			padding: 14px;
			font-size: 0.9rem;
			font-weight: 700;
		}


		td {
			padding: 12px 14px;
			border-bottom: 1px solid #F1D3DF;
			font-size: 0.9rem;
			vertical-align: middle;
		}


		.img-tabla {
			width: 50px;
			height: 50px;
			object-fit: cover;
			border-radius: 8px;
			border: 1px solid #F1D3DF;
		}


		/* =====================================================
		   BADGES Y CASILLAS
		   ===================================================== */

		.badge-toggle-group {
			display: flex;
			align-items: center;
			gap: 8px;
		}


		.badge-estado {
			padding: 5px 12px;
			border-radius: 12px;
			font-size: 0.8rem;
			font-weight: bold;
			display: inline-block;
		}


		.badge-disponible {
			background-color: var(--verde-bg);
			color: var(--verde);
		}


		.badge-oculto {
			background-color: var(--rojo-bg);
			color: var(--rojo);
		}


		.chk-rapido {
			width: 18px;
			height: 18px;
			cursor: pointer;
			accent-color: var(--rosa-oscuro);
		}


		/* =====================================================
		   BOTONES TABLA
		   ===================================================== */

		.tm-btn {
			border-radius: 8px;
			padding: 8px 16px;
			cursor: pointer;
			border: none;
			font-weight: bold;
		}


		.tm-btn-default {
			background-color: var(--rosa-dumbbo);
			border: 1px solid var(--rosa-dumbbo);
			color: var(--rosa-oscuro);
		}


		.tm-btn-default:hover {
			background-color: var(--rosa-oscuro);
			color: white;
		}


		.btn-editar-tabla {
			background-color: #FCE8F1;
			color: var(--rosa-oscuro);
			border: 1px solid var(--rosa-dumbbo);
			padding: 6px 14px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: bold;
			font-size: 0.85rem;
		}


		.btn-editar-tabla:hover {
			background-color: var(--rosa-dumbbo);
		}


		.btn-eliminar-tabla {
			background-color: var(--rojo);
			color: white;
			border: none;
			padding: 6px 14px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: bold;
			font-size: 0.85rem;
		}


		.btn-eliminar-tabla:hover {
			opacity: 0.9;
		}


		.hidden {
			display: none;
		}


		/* =====================================================
		   RESPONSIVE
		   ===================================================== */

		@media (max-width: 600px) {

			body {
				padding: 10px;
			}


			#admin-panel {
				margin: 15px auto;
				padding: 15px;
			}


			.admin-header {
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}


			.admin-header h2 {
				text-align: center;
			}


			.form-checkboxes {
				flex-direction: column;
				align-items: flex-start;
				gap: 10px;
			}


			.tm-btn {
				width: 100%;
			}


			.admin-header .tm-btn {
				width: 100%;
			}

		}

	</style>
</head>


<body>


	<!-- =====================================================
	     LOGIN
	     ===================================================== -->

	<div id="admin-login">

		<h2 style="color: var(--rosa-oscuro);">
			Panel Administrador - Dumbbo
		</h2>


		<input
			type="email"
			id="admin-email"
			placeholder="Correo electrónico"
			style="width:100%; padding:10px; margin-bottom:12px; border:1px solid #DFA5BB; border-radius:8px;"
		/>


		<input
			type="password"
			id="admin-password"
			placeholder="Contraseña"
			style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #DFA5BB; border-radius:8px;"
		/>


		<button
			id="btn-login"
			class="tm-btn tm-btn-default"
			style="width:100%;"
		>
			Iniciar sesión
		</button>


		<p
			id="login-error"
			style="color:var(--rojo); margin-top:10px;"
		></p>

	</div>



	<!-- =====================================================
	     PANEL ADMINISTRADOR
	     ===================================================== -->

	<div id="admin-panel" class="hidden">


		<div class="admin-header">

			<h2>
				Gestión de Productos
			</h2>


			<button
				id="btn-logout"
				class="tm-btn tm-btn-default"
			>
				Cerrar sesión
			</button>

		</div>



		<!-- =================================================
		     FORMULARIO PRODUCTO
		     ================================================= -->

		<form
			id="form-crear-producto"
			class="form-crear-producto"
		>

			<h3 id="form-titulo">
				+ Agregar Nuevo Producto
			</h3>


			<input
				type="hidden"
				id="producto-id-edit"
			/>


			<input
				type="hidden"
				id="imagen-actual-url"
			/>



			<div class="form-grid">


				<!-- NOMBRE -->

				<input
					type="text"
					id="nuevo-nombre"
					placeholder="Nombre (ej. Brownie de chocolate)"
					required
				/>



				<!-- CATEGORÍA -->

				<select
					id="nuevo-categoria"
					required
				>

					<option value="">
						-- Seleccionar Categoría --
					</option>


					<!--
						Las categorías se cargarán
						automáticamente desde Firebase.
					-->

					<option value="__nueva_categoria__">
						➕ Nueva categoría
					</option>

				</select>



				<!-- CAMPO NUEVA CATEGORÍA -->

				<div
					class="nueva-categoria-container"
					id="nueva-categoria-container"
				>

					<label
						class="nueva-categoria-label"
						for="nueva-categoria-input"
					>
						Nombre de la nueva categoría
					</label>


					<input
						type="text"
						id="nueva-categoria-input"
						placeholder="Ej. Postres"
						maxlength="50"
					/>

				</div>



				<!-- PRECIO -->

				<input
					type="number"
					id="nuevo-precio"
					placeholder="Precio ($)"
					required
				/>



				<!-- IMAGEN -->

				<div class="input-file-container">

					<label for="nuevo-imagen">
						Foto del producto:
					</label>


					<input
						type="file"
						id="nuevo-imagen"
						accept="image/*"
					/>

				</div>



				<!-- DESCRIPCIÓN -->

				<textarea
					id="nuevo-descripcion"
					placeholder="Descripción del producto..."
				></textarea>


			</div>



			<!-- CHECKBOXES -->

			<div class="form-checkboxes">

				<label>

					<input
						type="checkbox"
						id="nuevo-disponible"
						checked
					/>

					Disponible
					(Visible en la carta)

				</label>


				<label>

					<input
						type="checkbox"
						id="nuevo-promocion"
					/>

					Activar en Oferta 🔥

				</label>

			</div>



			<!-- BOTONES -->

			<div
				style="display: flex; gap: 10px; align-items: center;"
			>

				<button
					type="submit"
					id="btn-guardar"
					class="tm-btn tm-btn-default"
				>
					Guardar Producto en Firebase
				</button>


				<button
					type="button"
					id="btn-cancelar"
					class="tm-btn"
					style="background:#ccc; display:none;"
					onclick="limpiarFormulario()"
				>
					Cancelar
				</button>


				<span
					id="mensaje-carga"
					style="display:none; color:var(--rosa-oscuro); font-weight:bold;"
				>
					Guardando...
				</span>

			</div>

		</form>



		<!-- =================================================
		     LISTA DE PRODUCTOS
		     ================================================= -->

		<h3
			style="color: var(--rosa-oscuro); margin-bottom: 10px;"
		>
			Lista de Productos
		</h3>



		<div class="apartados-bar">

			<button
				class="btn-apartado active"
				onclick="filtrarTabla('todos', this)"
			>
				Todos
			</button>


			<button
				class="btn-apartado"
				onclick="filtrarTabla('disponible', this)"
			>
				Disponibles
			</button>


			<button
				class="btn-apartado"
				onclick="filtrarTabla('oculto', this)"
			>
				Ocultos
			</button>


			<button
				class="btn-apartado"
				onclick="filtrarTabla('oferta', this)"
			>
				🔥 En Oferta
			</button>

		</div>



		<!-- =================================================
		     TABLA
		     ================================================= -->

		<div class="tabla-container">

			<table>

				<thead>

					<tr>

						<th>Imagen</th>
						<th>Nombre</th>
						<th>Categoría</th>
						<th>Precio</th>
						<th>Estado</th>
						<th>Promoción</th>
						<th>Acciones</th>

					</tr>

				</thead>


				<tbody id="tabla-productos-body">

				</tbody>

			</table>

		</div>


	</div>



	<!-- =====================================================
	     JAVASCRIPT
	     ===================================================== -->

	<script
		type="module"
		src="admin.js"
	></script>


</body>
</html>
