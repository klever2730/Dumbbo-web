<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Dumbbo Café</title>
  <style>
    :root {
      --rosa-dumbbo: #F0AEC9;
      --rosa-claro: #FCE8F1;
      --rosa-oscuro: #7A294D;
      --texto: #3A2630;
      --blanco: #FFFFFF;
      --rojo-eliminar: #E53935;
      --verde-exito: #2E7D32;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--rosa-claro);
      color: var(--texto);
      margin: 0;
      padding: 20px;
    }

    /* PANTALLA DE LOGIN */
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: var(--blanco);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(122, 41, 77, 0.15);
      text-align: center;
    }

    .login-container h2 {
      color: var(--rosa-oscuro);
      margin-bottom: 20px;
    }

    /* PANEL PRINCIPAL */
    .admin-container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--blanco);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(122, 41, 77, 0.12);
      display: none; /* Se activa tras login */
      position: relative;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--rosa-claro);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .user-info-bar {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .timer-badge {
      background-color: var(--rosa-claro);
      color: var(--rosa-oscuro);
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-logout {
      background-color: var(--rojo-eliminar);
      color: var(--blanco);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }

    .btn-logout:hover {
      opacity: 0.9;
    }

    /* FORMULARIO DE PRODUCTO */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--rosa-oscuro);
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      padding: 10px 12px;
      border: 1px solid var(--rosa-dumbbo);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="file"] {
      font-size: 0.85rem;
    }

    .checkbox-panel {
      display: flex;
      gap: 25px;
      background-color: var(--rosa-claro);
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--rosa-oscuro);
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--rosa-oscuro);
      color: var(--blanco);
      border: none;
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }

    .btn-cancelar {
      background-color: #777;
      color: var(--blanco);
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      display: none;
    }

    /* TABLA DE PRODUCTOS */
    .tabla-container {
      overflow-x: auto;
      margin-top: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--rosa-claro);
      font-size: 0.9rem;
    }

    th {
      background-color: var(--rosa-claro);
      color: var(--rosa-oscuro);
    }

    .img-tabla {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 8px;
    }

    .btn-editar-todo {
      background-color: var(--rosa-dumbbo);
      color: var(--rosa-oscuro);
      border: 1px solid var(--rosa-oscuro);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .btn-eliminar {
      background-color: var(--rojo-eliminar);
      color: var(--blanco);
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .badge-estado {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-disponible { background-color: #E8F5E9; color: var(--verde-exito); }
    .badge-agotado { background-color: #FFEBEE; color: var(--rojo-eliminar); }
  </style>
</head>
<body>

  <div class="login-container" id="login-box">
    <h2>Admin Dumbbo Café 🐘</h2>
    <form id="login-form">
      <div class="form-group" style="margin-bottom: 12px;">
        <input type="email" id="login-email" placeholder="Correo electrónico" required />
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <input type="password" id="login-password" placeholder="Contraseña" required />
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Iniciar Sesión</button>
    </form>
  </div>

  <div class="admin-container" id="admin-panel">
    
    <div class="admin-header">
      <h1 style="font-size: 1.5rem; color: var(--rosa-oscuro); margin:0;">Gestión de Menú</h1>
      
      <div class="user-info-bar">
        <span class="timer-badge" id="timer-display">Sesión: 05:00</span>
        <button class="btn-logout" id="btn-logout-top">Cerrar Sesión</button>
      </div>
    </div>

    <h2 id="form-titulo" style="font-size: 1.2rem; color: var(--rosa-oscuro);">Agregar Nuevo Producto</h2>
    <form id="producto-form" style="margin-top: 15px;">
      <input type="hidden" id="producto-id" />
      <input type="hidden" id="imagen-actual-url" />

      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre del Producto</label>
          <input type="text" id="nombre" placeholder="Ej: Café Latte / Torta Amor" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">-- Seleccionar --</option>
            <option value="Bebestibles">Bebestibles</option>
            <option value="Cafetería">Cafetería</option>
            <option value="Dulces">Dulces</option>
            <option value="Pasteles">Pasteles</option>
            <option value="Snacks">Snacks</option>
            <option value="Sandwich">Sandwich</option>
            <option value="Promociones">Promociones</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" placeholder="Ej: 2500" min="0" required />
        </div>

        <div class="form-group">
          <label for="archivo-foto">Subir Foto (Archivo)</label>
          <input type="file" id="archivo-foto" accept="image/*" />
        </div>

        <div class="form-group full-width">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="2" placeholder="Detalles de preparación o ingredientes..."></textarea>
        </div>
      </div>

      <div class="checkbox-panel">
        <label class="checkbox-item">
          <input type="checkbox" id="disponible" checked />
          <span>Producto Disponible</span>
        </label>

        <label class="checkbox-item">
          <input type="checkbox" id="promocion" />
          <span>Activar en Promoción / Oferta</span>
