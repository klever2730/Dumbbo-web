<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Dumbbo Café</title>
  <style>
    :root {
      --rosa-dumbbo: #F0AEC9;
      --rosa-claro: #FCE8F1;
      --rosa-oscuro: #7A294D;
      --texto: #3A2630;
      --blanco: #FFFFFF;
      --rojo-eliminar: #E53935;
      --verde-exito: #4CAF50;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--rosa-claro);
      color: var(--texto);
      margin: 0;
      padding: 20px;
    }

    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--blanco);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(122, 41, 77, 0.12);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--rosa-claro);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1, h2 {
      color: var(--rosa-oscuro);
      margin: 0;
    }

    /* FORMULARIO */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--rosa-oscuro);
    }

    input, select, textarea {
      padding: 10px 12px;
      border: 1px solid var(--rosa-dumbbo);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--rosa-oscuro);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--rosa-oscuro);
      color: var(--blanco);
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #5c1e3a;
    }

    .btn-cancelar {
      background-color: #888;
      color: var(--blanco);
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      display: none;
    }

    /* TABLA DE PRODUCTOS */
    .tabla-container {
      overflow-x: auto;
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--rosa-claro);
      font-size: 0.9rem;
    }

    th {
      background-color: var(--rosa-claro);
      color: var(--rosa-oscuro);
    }

    .img-tabla {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 6px;
    }

    .acciones-btn {
      display: flex;
      gap: 6px;
    }

    .btn-editar {
      background-color: var(--rosa-dumbbo);
      color: var(--rosa-oscuro);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-eliminar {
      background-color: var(--rojo-eliminar);
      color: var(--blanco);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .badge-estado {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-disponible {
      background-color: #E8F5E9;
      color: var(--verde-exito);
    }

    .badge-agotado {
      background-color: #FFEBEE;
      color: var(--rojo-eliminar);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Panel Administrador</h1>
      <span style="font-weight: 600; color: var(--rosa-oscuro);">Dumbbo Café 🐘</span>
    </div>

    <h2 id="form-titulo">Agregar Nuevo Producto</h2>
    <form id="producto-form" style="margin-top: 15px;">
      <input type="hidden" id="producto-id" />

      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre del Producto</label>
          <input type="text" id="nombre" placeholder="Ej: Cafe Latte / Torta Amor" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">-- Seleccionar --</option>
            <option value="Bebestibles">Bebestibles</option>
            <option value="Cafetería">Cafetería</option>
            <option value="Dulces">Dulces</option>
            <option value="Pasteles">Pasteles</option>
            <option value="Snacks">Snacks</option>
            <option value="Sandwich">Sandwich</option>
            <option value="Promociones">Promociones</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" placeholder="Ej: 2500" min="0" required />
        </div>

        <div class="form-group">
          <label for="imagenUrl">URL de Imagen</label>
          <input type="url" id="imagenUrl" placeholder="https://..." />
        </div>

        <div class="form-group full-width">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="2" placeholder="Detalles de los ingredientes o preparación..."></textarea>
        </div>
      </div>

      <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px;">
        <div class="checkbox-group">
          <input type="checkbox" id="disponible" checked />
          <label for="disponible">Disponible para venta</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="promocion" />
          <label for="promocion">¿Es Promoción / Oferta?</label>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn-submit" id="btn-guardar">Guardar Producto</button>
        <button type="button" class="btn-cancelar" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
      </div>
    </form>

    <h2 style="margin-top: 40px;">Lista de Productos</h2>
    <div class="tabla-container">
      <table>
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Promoción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos-body">
          </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEhG5JEj8s2GMQgdceHY3LeUa_32jx_MI",
      authDomain: "dumbbo-menu.firebaseapp.com",
      projectId: "dumbbo-menu",
      storageBucket: "dumbbo-menu.firebasestorage.app",
      messagingSenderId: "875230670130",
      appId: "1:875230670130:web:63ad4fb93cb7bf2c8bbb2b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("producto-form");
    const tablaBody = document.getElementById("tabla-productos-body");

    // LEER PRODUCTOS EN TIEMPO REAL
    onSnapshot(collection(db, "productos"), (snapshot) => {
      tablaBody.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const id = docSnap.id;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img src="${p.imagenUrl || 'img/logo.png'}" class="img-tabla" alt="${p.nombre}"></td>
          <td><strong>${p.nombre}</strong></td>
          <td>${p.categoria}</td>
          <td>$${Number(p.precio).toLocaleString('es-CL')}</td>
          <td>
            <span class="badge-estado ${p.disponible ? 'badge-disponible' : 'badge-agotado'}">
              ${p.disponible ? 'Disponible' : 'Agotado'}
            </span>
          </td>
          <td>${p.promocion ? '🔥 Sí' : 'No'}</td>
          <td class="acciones-btn">
            <button class="btn-editar" onclick="cargarEdicion('${id}', '${p.nombre}', '${p.categoria}', ${p.precio}, '${p.imagenUrl || ''}', '${p.descripcion || ''}', ${p.disponible}, ${p.promocion})">Editar</button>
            <button class="btn-eliminar" onclick="eliminarProducto('${id}')">Eliminar</button>
          </td>
        `;
        tablaBody.appendChild(tr);
      });
    });

    // GUARDAR O ACTUALIZAR
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("producto-id").value;
      const productoData = {
        nombre: document.getElementById("nombre").value,
        categoria: document.getElementById("categoria").value,
        precio: Number(document.getElementById("precio").value),
        imagenUrl: document.getElementById("imagenUrl").value,
        descripcion: document.getElementById("descripcion").value,
        disponible: document.getElementById("disponible").checked,
        promocion: document.getElementById("promocion").checked
      };

      try {
        if (id) {
          await updateDoc(doc(db, "productos", id), productoData);
          alert("¡Producto actualizado exitosamente!");
        } else {
          await addDoc(collection(db, "productos"), productoData);
          alert("¡Producto creado exitosamente!");
        }
        limpiarFormulario();
      } catch (error) {
        console.error("Error al guardar: ", error);
        alert("Ocurrió un error al guardar el producto.");
      }
    });

    // EDITAR
    window.cargarEdicion = (id, nombre, categoria, precio, imagenUrl, descripcion, disponible, promocion) => {
      document.getElementById("producto-id").value = id;
      document.getElementById("nombre").value = nombre;
      document.getElementById("categoria").value = categoria;
      document.getElementById("precio").value = precio;
      document.getElementById("imagenUrl").value = imagenUrl;
      document.getElementById("descripcion").value = descripcion;
      document.getElementById("disponible").checked = disponible;
      document.getElementById("promocion").checked = promocion;

      document.getElementById("form-titulo").innerText = "Editar Producto";
      document.getElementById("btn-guardar").innerText = "Actualizar Producto";
      document.getElementById("btn-cancelar").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // ELIMINAR
    window.eliminarProducto = async (id) => {
      if (confirm("¿Estás seguro de que deseas eliminar este producto?")) {
        try {
          await deleteDoc(doc(db, "productos", id));
        } catch (error) {
          console.error("Error al eliminar: ", error);
        }
      }
    };

    // LIMPIAR
    window.limpiarFormulario = () => {
      form.reset();
      document.getElementById("producto-id").value = "";
      document.getElementById("form-titulo").innerText = "Agregar Nuevo Producto";
      document.getElementById("btn-guardar").innerText = "Guardar Producto";
      document.getElementById("btn-cancelar").style.display = "none";
    };
  </script>
</body>
</html>
