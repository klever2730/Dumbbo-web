<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Migración a multi-local - Dumbbo</title>
	<style>
		body { font-family: system-ui, sans-serif; background:#FCE8F1; padding:20px; }
		.box { max-width:500px; margin:60px auto; background:#FFF; padding:30px; border-radius:16px; box-shadow:0 8px 25px rgba(122,41,77,0.15); }
		h2 { color:#7A294D; }
		input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #DFA5BB; border-radius:8px; box-sizing:border-box; }
		button { width:100%; padding:12px; border:none; border-radius:8px; background:#F0AEC9; color:#7A294D; font-weight:bold; cursor:pointer; }
		button:disabled { opacity:0.5; cursor:not-allowed; }
		#log { margin-top:16px; font-size:0.85rem; color:#3A2630; white-space:pre-wrap; background:#FFF9FB; border:1px solid #F1D3DF; border-radius:8px; padding:12px; max-height:300px; overflow-y:auto; }
		#login-error { color:#E53935; }
	</style>
</head>
<body>
	<div class="box">
		<h2>Migración: productos → locales</h2>
		<p style="font-size:0.85rem; color:#777;">
			Copia cada producto de la colección "productos" hacia <strong>locales/GHU</strong>, <strong>locales/VK1</strong>, <strong>locales/VK2</strong> y <strong>locales/Duoc</strong> como documentos independientes. Corre esto <strong>una sola vez</strong>. Inicia sesión con tu cuenta admin.
		</p>

		<div id="login-box">
			<input type="email" id="admin-email" placeholder="Correo electrónico" />
			<input type="password" id="admin-password" placeholder="Contraseña" />
			<button id="btn-login">Iniciar sesión</button>
			<p id="login-error"></p>
		</div>

		<div id="panel-box" style="display:none;">
			<button id="btn-migrar">🚀 Migrar productos a los 4 locales</button>
			<div id="log"></div>
		</div>
	</div>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
		import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
		import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

		const firebaseConfig = {
			apiKey: "AIzaSyDEhG5JEj8s2GMQgdceHY3LeUa_32jx_MI",
			authDomain: "dumbbo-menu.firebaseapp.com",
			projectId: "dumbbo-menu",
			storageBucket: "dumbbo-menu.firebasestorage.app",
			messagingSenderId: "875230670130",
			appId: "1:875230670130:web:63ad4fb93cb7bf2c8bbb2b"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const db = getFirestore(app);

		const LOCALES = ["GHU", "VK1", "VK2", "Duoc"];

		const logDiv = document.getElementById("log");
		function log(msg) {
			logDiv.textContent += msg + "\n";
			logDiv.scrollTop = logDiv.scrollHeight;
		}

		onAuthStateChanged(auth, (user) => {
			document.getElementById("login-box").style.display = user ? "none" : "block";
			document.getElementById("panel-box").style.display = user ? "block" : "none";
		});

		document.getElementById("btn-login").addEventListener("click", async () => {
			const email = document.getElementById("admin-email").value;
			const pass = document.getElementById("admin-password").value;
			try {
				await signInWithEmailAndPassword(auth, email, pass);
			} catch (err) {
				document.getElementById("login-error").innerText = "Credenciales incorrectas.";
			}
		});

		document.getElementById("btn-migrar").addEventListener("click", async () => {
			const boton = document.getElementById("btn-migrar");

			const confirmar = confirm(
				"Esto va a copiar cada producto de 'productos' hacia los 4 locales (GHU, VK1, VK2, Duoc) " +
				"como documentos nuevos e independientes. Ejecuta esto solo una vez para evitar duplicados. ¿Continuar?"
			);
			if (!confirmar) return;

			boton.disabled = true;
			log("Leyendo productos actuales...");

			try {
				const snapshot = await getDocs(collection(db, "productos"));
				const productos = [];
				snapshot.forEach(docSnap => productos.push(docSnap.data()));

				log(`Encontrados ${productos.length} productos. Copiando a cada local...`);

				let totalCopiados = 0;

				for (const local of LOCALES) {
					log(`\n→ Copiando a ${local}...`);
					for (const producto of productos) {
						await addDoc(collection(db, "locales", local, "productos"), producto);
						totalCopiados++;
						log(`   ✓ ${producto.nombre || "(sin nombre)"}`);
					}
				}

				log(`\n✅ Listo. ${totalCopiados} documentos creados en total (${productos.length} productos × ${LOCALES.length} locales).`);
				log("La colección 'productos' original queda intacta como respaldo — puedes borrarla manualmente desde la consola de Firebase cuando confirmes que todo quedó bien.");
			} catch (error) {
				log("❌ Error: " + error.message);
			} finally {
				boton.disabled = false;
			}
		});
	</script>
</body>
</html>
